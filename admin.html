<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Anguilla Lottery | Sistema Multipantalla Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --anguilla-orange: #f97316;
        --anguilla-blue: #0b1f4b;
        --anguilla-blue-dark: #06132f;
        --anguilla-yellow: #fbbf24;
        --white: #ffffff;
        --gray-text: #475569;
        --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
        --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        background: #000; height: 100%; width: 100%;
        overflow: hidden; margin: 0; padding: 0;
    }

    /* --- SPLASH --- */
    #splash-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 50%, var(--anguilla-blue) 0%, var(--anguilla-blue-dark) 100%);
        z-index: 99999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        transition: opacity 1s ease-in-out, visibility 1s;
    }
    .splash-logo { height: 320px; object-fit: contain; animation: floating 3s ease-in-out infinite; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5)); }
    .splash-text { color: var(--white); font-family: 'Inter', sans-serif; font-size: 42px; font-weight: 800; margin-top: 40px; letter-spacing: 2px; text-shadow: 0 4px 10px rgba(0,0,0,0.4); }
    .splash-sub { color: var(--anguilla-yellow); font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; margin-top: 10px; letter-spacing: 4px; animation: pulse 1.5s infinite alternate; }

    #canvas-master {
        width: 1920px; height: 1080px;
        background: radial-gradient(circle at 50% 20%, #173b78 0%, #0b1f4b 42%, #06132f 100%);
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        transform-origin: center center;
        overflow: hidden;
    }

    /* --- TOPBAR --- */
    .topbar {
        width: 100%; height: 151px;
        background: linear-gradient(135deg, var(--anguilla-blue) 0%, var(--anguilla-blue-dark) 100%);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 50px; border-bottom: 5px solid var(--anguilla-yellow);
        box-shadow: 0 8px 32px rgba(0,0,0,0.35);
        position: relative; z-index: 10;
    }
    .logo-main-area img { height: 210px; object-fit: contain; padding-top: 10%; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.25)); }

    .header-info { display: flex; align-items: center; gap: 40px; }
    .header-clock {
        font-size: 61px; font-weight: 900; color: var(--white); line-height: 1;
        border-right: 4px solid rgba(255, 204, 0, 0.4); padding-right: 40px;
        font-variant-numeric: tabular-nums; text-shadow: 0 4px 12px rgba(0,0,0,0.3);
    }
    .date-header { text-align: right; }
    .main-date { font-size: 38px; font-weight: 900; color: var(--anguilla-yellow); text-transform: uppercase; line-height: 1; text-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .sub-date { font-size: 19px; font-weight: 700; color: var(--white); opacity: 0.95; letter-spacing: 0.5px; margin-top: 2px; }

    /* --- INDICADOR DE CONEXIÓN --- */
    .connection-status { display: inline-flex; align-items: center; gap: 8px; margin-left: 15px; cursor: default; position: relative; }
    .connection-dot { width: 16px; height: 16px; border-radius: 50%; display: inline-block; transition: all 0.3s ease; box-shadow: 0 0 12px rgba(0,0,0,0.3); flex-shrink: 0; }
    .connection-dot.online { background: #22c55e; box-shadow: 0 0 20px rgba(34, 197, 94, 0.5); animation: pulse-dot-online 2s infinite; }
    .connection-dot.offline { background: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); animation: pulse-dot-offline 1s infinite; }
    .connection-dot.checking { background: #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.5); animation: pulse-dot-checking 0.8s infinite; }
    .connection-tooltip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: white; padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.3s; font-family: 'Inter', sans-serif; z-index: 100; }
    .connection-status:hover .connection-tooltip { opacity: 1; }
    .offline-badge { display: none; background: #ef4444; color: white; font-size: 16px; font-weight: 800; padding: 2px 14px; border-radius: 20px; margin-left: 10px; animation: pulse 1s infinite alternate; letter-spacing: 0.5px; }
    .offline-badge.show { display: inline-block; }

    @keyframes pulse-dot-online { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.9); } }
    @keyframes pulse-dot-offline { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }
    @keyframes pulse-dot-checking { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }

    /* --- TICKER --- */
    .ticker-bar {
        width: 100%; height: 54px;
        background: #090909; border-bottom: 4px solid var(--anguilla-yellow);
        overflow: hidden; display: flex; align-items: center;
        position: relative; z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .ticker-text { white-space: nowrap; font-size: 26px; font-weight: 800; color: #fff; animation: marquee 25s linear infinite; padding-left: 100%; letter-spacing: 0.5px; }
    @keyframes marquee { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }

    /* --- CONTENEDORES CON TRANSICIÓN --- */
    #view-grid, #view-featured, #view-ads, #view-realenoche {
        height: 875px; padding: 25px 30px;
        position: absolute; width: 100%; top: 205px; left: 0;
        z-index: 1; opacity: 1; transform: scale(1) translateY(0px);
        visibility: visible;
        transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1),
                    transform 0.6s cubic-bezier(0.25, 1, 0.5, 1),
                    visibility 0.6s;
    }
    .hidden { opacity: 0 !important; transform: scale(0.98) translateY(20px) !important; visibility: hidden !important; }

    /* --- TARJETAS GRID --- */
    .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 25px; height: 100%; }
    .card {
        background: var(--white); border-radius: 24px; border: 1px solid rgba(255, 204, 0, 0.7);
        display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-md);
        position: relative;
    }
    .card::before { content: ''; position: absolute; top:0; left:0; right:0; height: 6px; background: var(--anguilla-yellow); }
    .card-header { padding: 15px 0 10px 0; display: flex; flex-direction: column; align-items: center; background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%); }
    .mini-logo { height: 135px; margin-bottom: 10px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05)); }
    .time-bar { width: 85%; text-align: center; padding: 5px 0; font-size: 35px; font-weight: 900; border-radius: 50px; background: #1e293b; color: #ffcc00; box-shadow: var(--shadow-sm); }
    .card-hoy .time-bar { background: #13a705; color: white; }
    .date-tag { font-size: 16px; font-weight: 800; color: var(--gray-text); text-transform: uppercase; margin-top: 6px; letter-spacing: 0.5px; }
    .cached-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: #f59e0b; font-size: 11px; padding: 2px 10px; border-radius: 12px; font-weight: 700; letter-spacing: 0.3px; border: 1px solid rgba(245, 158, 11, 0.3); z-index: 5; }

    /* --- BOLOS 3D --- */
    .ball-base { border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; text-shadow: 0 2px 4px rgba(0,0,0,0.3); position: relative; transition: transform 0.2s ease; animation: dropIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.15) both; }
    .ball-base:hover { transform: scale(1.03); }

    .ball-small {
        width: 100px; height: 100px;
        background: radial-gradient(circle at 30% 30%, #60a5fa 0%, #3b82f6 30%, #2563eb 60%, #1d4ed8 85%, #1e40af 100%);
        color: white; border-radius: 50%;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 38px; font-weight: 800;
        box-shadow: inset -6px -6px 16px rgba(0,0,0,0.4), inset 4px 4px 10px rgba(255,255,255,0.5), 0 8px 20px rgba(0,0,0,0.25);
        border: 2px solid rgba(255,255,255,0.15);
        text-shadow: 0 2px 6px rgba(0,0,0,0.3);
        animation: dropIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.15) both;
    }

    .ball-flat {
        width: 125px; height: 125px; border-radius: 50%;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 56px; font-weight: 900;
        border: 2px solid rgba(255,255,255,0.15);
        animation: dropIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.15) both;
        transition: transform 0.2s;
    }
    .ball-flat:hover { transform: scale(1.05); }
    .card-hoy .ball-flat { background: radial-gradient(circle at 30% 30%, #60a5fa 0%, #3b82f6 30%, #2563eb 60%, #1d4ed8 85%, #1e40af 100%); color: #ffffff; box-shadow: inset -8px -8px 20px rgba(0,0,0,0.4), inset 4px 4px 12px rgba(255,255,255,0.5), 0 12px 25px rgba(0,0,0,0.3); text-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    .card-ayer .ball-flat { background: radial-gradient(circle at 30% 30%, #f1f5f9 0%, #e2e8f0 30%, #cbd5e1 60%, #94a3b8 85%, #64748b 100%); color: #1e293b; box-shadow: inset -8px -8px 20px rgba(0,0,0,0.2), inset 4px 4px 12px rgba(255,255,255,0.7), 0 12px 25px rgba(0,0,0,0.2); text-shadow: 0 1px 2px rgba(255,255,255,0.5); }

    .ball-big {
        width: 205px; height: 205px; border-radius: 50%;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 100px; font-weight: 900;
        border: 3px solid rgba(255,255,255,0.15);
        animation: dropIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.15) both;
        transition: transform 0.2s;
        position: relative;
    }
    .ball-big:hover { transform: scale(1.03); }
    /* Bolo AZUL = HOY */
    .ball-big.blue { background: radial-gradient(circle at 30% 30%, #60a5fa 0%, #3b82f6 30%, #2563eb 60%, #1d4ed8 85%, #1e40af 100%); color: #ffffff; box-shadow: inset -12px -12px 30px rgba(0,0,0,0.5), inset 6px 6px 18px rgba(255,255,255,0.6), 0 20px 40px rgba(0,0,0,0.4); text-shadow: 0 3px 10px rgba(0,0,0,0.5); }
    /* Bolo BLANCO = AYER (u otros días) */
    .ball-big.white {
        background: radial-gradient(circle at 30% 30%, #ffffff 0%, #f8fafc 40%, #e2e8f0 80%, #cbd5e1 100%);
        color: #1e293b;
        border: 3px solid rgba(0,0,0,0.15);
        box-shadow:
            inset -12px -12px 30px rgba(0,0,0,0.15),
            inset 6px 6px 18px rgba(255,255,255,0.9),
            0 20px 40px rgba(0,0,0,0.25);
        text-shadow: 0 1px 2px rgba(255,255,255,0.6);
    }
    .ball-small.white {
        background: radial-gradient(circle at 30% 30%, #ffffff 0%, #f8fafc 40%, #e2e8f0 80%, #cbd5e1 100%);
        color: #1e293b;
        border: 2px solid rgba(0,0,0,0.15);
        box-shadow:
            inset -6px -6px 16px rgba(0,0,0,0.15),
            inset 4px 4px 10px rgba(255,255,255,0.9),
            0 8px 20px rgba(0,0,0,0.2);
        text-shadow: 0 1px 2px rgba(255,255,255,0.6);
    }

    @keyframes dropIn {
        0% { opacity: 0; transform: scale(0.4) translateY(-60px) rotate(-10deg); }
        60% { transform: scale(1.05) translateY(8px) rotate(2deg); }
        100% { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
    }

    /* --- SPLIT CONTAINER --- */
    .split-container { display: flex; gap: 25px; height: 100%; width: 100%; }
    .split-main {
        width: 1190px;
        background: linear-gradient(145deg, var(--anguilla-blue) 0%, var(--anguilla-blue-dark) 100%);
        border: 5px solid var(--anguilla-yellow);
        border-radius: 32px; display: flex; flex-direction: column; align-items: center;
        justify-content: center; padding: 30px; box-shadow: var(--shadow-lg); overflow: hidden;
        position: relative;
    }
    .side-panel { width: 730px; display: flex; flex-direction: column; gap: 15px; }
    .side-row {
        background: white; border-radius: 20px; padding: 0 30px; display: flex;
        justify-content: space-between; align-items: center; border-left: 12px solid var(--anguilla-blue);
        box-shadow: var(--shadow-md); flex: 1;
    }
    .side-time { color: var(--anguilla-blue); font-size: 34px; font-weight: 900; }

    .featured-label { font-size: 26px; background: rgba(255,255,255,0.12); padding: 6px 30px; border-radius: 50px; margin-bottom: 20px; font-weight: 800; color: #fff; letter-spacing: 1px; }
    .featured-logo-big { height: 275px; margin-bottom: 20px; filter: drop-shadow(0 12px 20px rgba(0,0,0,0.4)); object-fit: contain; }
    .featured-time-box { font-size: 100px; background: var(--anguilla-yellow); color: var(--anguilla-blue); padding: 4px 70px; border-radius: 24px; font-weight: 900; box-shadow: var(--shadow-md); }

    /* NUEVA: Fecha grande abajo del sorteo destacado */
    .featured-date-big {
        font-size: 30px;
        font-weight: 800;
        color: var(--white);
        margin-top: 18px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        opacity: 0.95;
        text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .balls-container { display: flex; justify-content: center; align-items: center; gap: 18px; padding: 15px; background: transparent; border-radius: 20px; flex-grow: 1; width: 100%; }

    .ad-box { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; border-radius: 24px; position: relative; }
    .ad-box img, .ad-box video { width: 100%; height: 100%; object-fit: contain; }
    .ad-box iframe { width: 100%; height: 100%; border: none; }

    .waiting-text { color: #dc2626; font-size: 26px; font-weight: 900; text-align: center; animation: pulse 1.2s infinite alternate; width: 100%; margin: auto 0; letter-spacing: 0.5px; }

    .live-indicator {
        position: absolute; top: 25px; left: 25px;
        background: #e63946; color: #fff;
        font-family: 'Inter', sans-serif;
        font-size: 24px; font-weight: 900;
        padding: 8px 24px; border-radius: 8px;
        box-shadow: 0 0 20px #e63946;
        letter-spacing: 1.5px; z-index: 50;
        animation: pulse 0.8s infinite alternate;
        display: inline-flex; align-items: center; gap: 8px;
    }

    #preloader-cache { position: absolute; width: 1px; height: 1px; opacity: 0.01; overflow: hidden; bottom: 0; left: 0; pointer-events: none; }

    @keyframes pulse { 0% { opacity: 0.4; } 100% { opacity: 1; } }
    @keyframes floating {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
        100% { transform: translateY(0px); }
    }

    /* ============================================
       REAL NOCHE — MISMO ESTILO ANGUILLA
       HOY  → bolos azules
       AYER → bolos blancos
       ============================================ */
    .reallogo-main {
        height: 275px;
        margin-bottom: 20px;
        filter: drop-shadow(0 12px 20px rgba(0,0,0,0.4));
        object-fit: contain;
    }
</style>
</head>
<body>

<div id="splash-screen">
    <img src="logo.png" class="splash-logo" alt="Logo Empresa">
    <div class="splash-text">INICIANDO SISTEMA</div>
    <div class="splash-sub">POR FAVOR ESPERE...</div>
</div>

<div id="preloader-cache"></div>

<div id="canvas-master">
    <div class="topbar">
        <div class="logo-main-area"><img src="logo.png" alt="Logo"></div>
        <div class="header-info">
            <div class="header-clock" id="liveClock">00:00:00</div>
            <div class="date-header">
                <div class="main-date" id="currentDay">...</div>
                <div class="sub-date" id="currentMonth">...</div>
                <div class="connection-status" id="connectionStatus">
                    <span class="connection-dot checking" id="connectionDot"></span>
                    <span class="connection-tooltip" id="connectionTooltip">Verificando...</span>
                </div>
                <span class="offline-badge" id="offlineBadge">📡 SIN CONEXIÓN</span>
            </div>
        </div>
    </div>

    <div class="ticker-bar">
        <div class="ticker-text" id="marqueeText">CARGANDO INFORMACIÓN...</div>
    </div>

    <div id="view-grid">
        <div class="grid-container" id="mainGrid"></div>
    </div>

    <div id="view-featured" class="hidden">
        <div class="split-container">
            <div class="split-main">
                <div class="featured-label">ÚLTIMO SORTEO REALIZADO</div>
                <img src="anguilla.png" class="featured-logo-big" alt="Anguilla">
                <div class="featured-time-box" id="fTime">--:--</div>
                <div class="balls-container" style="background:transparent; margin-top:20px;" id="fBalls"></div>
                <div class="featured-date-big" id="fDate">--</div>
            </div>
            <div class="side-panel" id="sidePanelFeatured"></div>
        </div>
    </div>

    <div id="view-realenoche" class="hidden">
        <div class="split-container">
            <div class="split-main">
                <div class="featured-label">🌙 REAL NOCHE · ÚLTIMO SORTEO</div>
                <img src="logoreal.png" class="reallogo-main" alt="Real Noche" onerror="this.src='anguilla.png'">
                <div class="featured-time-box" id="realTime">--:--</div>
                <div class="balls-container" style="background:transparent; margin-top:20px;" id="realBalls"></div>
                <div class="featured-date-big" id="realDate">--</div>
            </div>
            <div class="side-panel" id="sidePanelReal"></div>
        </div>
    </div>

    <div id="view-ads" class="hidden">
        <div class="split-container" id="adsContainerStructure">
            <div class="split-main" id="adMainBox" style="background: #000; padding: 0; border: none;">
                <div class="ad-box" id="adDisplay"></div>
            </div>
            <div class="side-panel" id="sidePanelAds"></div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = { databaseURL: "https://pizarra-loteria-36ba5-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let SORTEOS = [];
    let REAL_NOCHE_SORTEOS = [];
    let ANUNCIOS = [];
    let currentView = 0;
    let gridPage = 0;
    let adIndex = 0;
    let rotationInterval = null;
    let enTransmisionVivo = false;
    let sistemaIniciado = false;
    let tiempoRotacionGlobal = 15000;
    let usandoCache = false;
    let isOnline = true;

    // ============================================
    // CACHE
    // ============================================
    function guardarEnCache(clave, datos) {
        try { localStorage.setItem(`anguilla_${clave}`, JSON.stringify({ data: datos, timestamp: Date.now() })); }
        catch (e) { console.warn('No se pudo guardar en cache:', e); }
    }
    function obtenerDeCache(clave) {
        try {
            const item = localStorage.getItem(`anguilla_${clave}`);
            if (!item) return null;
            return JSON.parse(item);
        } catch (e) { return null; }
    }
    function cargarDesdeCache() {
        usandoCache = true;
        let datosCargados = false;
        const sorteosCache = obtenerDeCache('sorteos');
        if (sorteosCache?.data?.length) { SORTEOS = sorteosCache.data; datosCargados = true; }
        const realCache = obtenerDeCache('realNoche');
        if (realCache?.data?.length) { REAL_NOCHE_SORTEOS = realCache.data; datosCargados = true; }
        const anunciosCache = obtenerDeCache('anuncios');
        if (anunciosCache?.data?.length) { ANUNCIOS = anunciosCache.data.filter(ad => ad.activo !== false); datosCargados = true; }
        const tickerCache = obtenerDeCache('ticker');
        if (tickerCache?.data) document.getElementById('marqueeText').innerText = tickerCache.data;
        const tiempoCache = obtenerDeCache('tiempoRotacion');
        if (tiempoCache?.data) tiempoRotacionGlobal = tiempoCache.data;

        if (datosCargados && sistemaIniciado && !enTransmisionVivo) {
            renderGrid();
            if (currentView === 88) renderFeatured();
            if (currentView === 111) renderRealNoche();
            if (!rotationInterval) rotationInterval = setInterval(rotateDisplay, tiempoRotacionGlobal);
        }
    }

    // ============================================
    // CONEXIÓN
    // ============================================
    function actualizarIndicadorConexion(estado, mensaje) {
        const dot = document.getElementById('connectionDot');
        const tooltip = document.getElementById('connectionTooltip');
        const badge = document.getElementById('offlineBadge');
        dot.className = 'connection-dot';
        if (estado === 'online') { dot.classList.add('online'); tooltip.textContent = mensaje || '✅ Conectado'; badge.classList.remove('show'); isOnline = true; }
        else if (estado === 'offline') { dot.classList.add('offline'); tooltip.textContent = mensaje || '❌ Sin conexión'; badge.classList.add('show'); isOnline = false; usandoCache = true; }
        else { dot.classList.add('checking'); tooltip.textContent = mensaje || '⏳ Verificando...'; }
    }
    function verificarConexion() {
        actualizarIndicadorConexion('checking', '⏳ Verificando conexión...');
        database.ref('.info/connected').once('value', (snap) => {
            if (snap.val()) {
                actualizarIndicadorConexion('online', '✅ Conectado a Firebase');
                isOnline = true;
                if (usandoCache) { usandoCache = false; cargarDatosFirebase(); }
            } else {
                actualizarIndicadorConexion('offline', '❌ Sin conexión a Firebase');
                isOnline = false; cargarDesdeCache();
            }
        }).catch(() => {
            fetch('https://www.google.com/favicon.ico', { mode: 'no-cors', cache: 'no-cache' })
                .then(() => { actualizarIndicadorConexion('online', '✅ Conectado a internet'); isOnline = true; })
                .catch(() => { actualizarIndicadorConexion('offline', '❌ Sin conexión a internet'); isOnline = false; cargarDesdeCache(); });
        });
    }
    function monitorearConexion() {
        database.ref('.info/connected').on('value', (snap) => {
            if (snap.val()) {
                actualizarIndicadorConexion('online', '✅ Conectado a Firebase');

            } else {
                actualizarIndicadorConexion('offline', '❌ Sin conexión a Firebase');
                isOnline = false; cargarDesdeCache();
            }
        });
    }

    // ============================================
    // HELPERS
    // ============================================
    function convertirHoraAminutos(horaStr) {
        if (!horaStr) return 0;
        const match = horaStr.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
        if (!match) return 0;
        let h = parseInt(match[1]);
        const m = parseInt(match[2]);
        const ampm = match[3].toUpperCase();
        if (ampm === 'PM' && h !== 12) h += 12;
        if (ampm === 'AM' && h === 12) h = 0;
        return h * 60 + m;
    }
    function ordenarSorteosCronologicamente(sorteos) {
        const hoy = sorteos.filter(s => s.day === 'hoy');
        const ayer = sorteos.filter(s => s.day === 'ayer');
        const ordenarPorHora = (arr) => arr.sort((a, b) => convertirHoraAminutos(a.hour) - convertirHoraAminutos(b.hour));
        return [...ordenarPorHora(hoy), ...ordenarPorHora(ayer)];
    }
    function getFormatDate(offsetDays = 0) {
        const d = new Date();
        d.setDate(d.getDate() - offsetDays);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    // Formato legible: "JUEVES 10 SEPTIEMBRE 2026"
    function formatearFechaLarga(isoOrOffset) {
        let d;
        if (typeof isoOrOffset === 'number') {
            d = new Date();
            d.setDate(d.getDate() - isoOrOffset);
        } else if (typeof isoOrOffset === 'string' && isoOrOffset.includes('-')) {
            d = new Date(isoOrOffset + 'T12:00:00');
        } else {
            d = new Date();
        }
        const dias = ['DOMINGO', 'LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];
        const meses = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
        return `${dias[d.getDay()]} ${d.getDate()} ${meses[d.getMonth()]} ${d.getFullYear()}`;
    }
    function esVideoDirecto(url) {
        if (!url) return false;
        return url.includes('github.com') || url.includes('raw.githubusercontent') || /\.(mp4|webm|ogg|mov)$/i.test(url);
    }
    function esImagen(url) {
        if (!url) return false;
        return /\.(jpg|jpeg|png|gif|webp|svg|bmp|ico)$/i.test(url);
    }
    function convertirLinkGitHub(url) {
        if (!url) return url;
        url = url.trim();
        if (url.includes('raw.githubusercontent.com')) return url;
        if (url.includes('github.com') && url.includes('/blob/')) return url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
        if (url.includes('github.com') && url.includes('?raw=true')) return url.replace('github.com', 'raw.githubusercontent.com');
        if (url.includes('github.com') && !url.includes('raw.githubusercontent.com')) {
            const match = url.match(/github\.com\/([^\/]+\/[^\/]+\/blob\/[^?]+)/);
            if (match) return 'https://raw.githubusercontent.com/' + match[1].replace('/blob/', '/');
        }
        return url;
    }

    // ============================================
    // CARGA DE DATOS
    // ============================================
    function procesarSorteosData(dataHoy, dataAyer) {
        let finalSorteos = [];
        const ahora = new Date();
        const horaAct = { hrs: ahora.getHours(), mins: ahora.getMinutes() };
        if (!dataHoy || dataHoy.length === 0) return finalSorteos;

        dataHoy.forEach((sHoy, index) => {
            if (!sHoy) return;
            let [h, mP] = sHoy.hora.split(":");
            let mSor = parseInt(mP.substring(0, 2));
            let ampm = mP.substring(2).trim();
            let hSor = parseInt(h);
            if (ampm === "PM" && hSor !== 12) hSor += 12;
            if (ampm === "AM" && hSor === 12) hSor = 0;

            const tieneHoy = sHoy.premios && sHoy.premios[0] !== "" && sHoy.premios[0] !== undefined && sHoy.premios[0] !== null;
            const yaPasoHora = (horaAct.hrs > hSor || (horaAct.hrs === hSor && horaAct.mins >= mSor + 5));

            let sorteoFinal = { hour: sHoy.hora.replace(/(AM|PM)/, ' $1'), key: index };

            if (tieneHoy) {
                sorteoFinal.day = "hoy"; sorteoFinal.date = "HOY";
                sorteoFinal.nums = [sHoy.premios[0], sHoy.premios[1], sHoy.premios[2]];
                sorteoFinal.isWaiting = false;
            } else if (yaPasoHora) {
                sorteoFinal.day = "hoy"; sorteoFinal.date = "HOY";
                sorteoFinal.nums = null; sorteoFinal.isWaiting = true;
            } else {
                const sAyer = dataAyer && dataAyer[index] ? dataAyer[index] : null;
                sorteoFinal.day = "ayer"; sorteoFinal.date = "AYER";
                sorteoFinal.nums = (sAyer?.premios?.[0] !== "" && sAyer?.premios?.[0] != null) ? [sAyer.premios[0], sAyer.premios[1], sAyer.premios[2]] : null;
                sorteoFinal.isWaiting = false;
            }
            finalSorteos.push(sorteoFinal);
        });
        return finalSorteos;
    }

    function cargarDatosFirebase() {
        const hoyStr = getFormatDate(0);
        const ayerStr = getFormatDate(1);

        database.ref('ticker').once('value', snap => {
            const tickerText = snap.val() || "BIENVENIDOS A ANGUILLA LOTTERY";
            document.getElementById('marqueeText').innerText = tickerText;
            guardarEnCache('ticker', tickerText);
        });

        database.ref(`sorteos/${hoyStr}`).once('value', snapHoy => {
            const dataHoy = snapHoy.val() || [];
            database.ref(`sorteos/${ayerStr}`).once('value', snapAyer => {
                const dataAyer = snapAyer.val() || [];
                const procesados = procesarSorteosData(dataHoy, dataAyer);
                if (procesados?.length) {
                    SORTEOS = ordenarSorteosCronologicamente(procesados);
                    guardarEnCache('sorteos', SORTEOS);
                    if (sistemaIniciado && !enTransmisionVivo) {
                        renderGrid();
                        if (currentView === 88) renderFeatured();
                    }
                }
            });
        });

        database.ref('anunciosList').once('value', snap => {
            const anuncios = [];
            if (snap.exists()) snap.forEach(child => {
                let item = child.val();
                if (item?.activo !== false && item?.url?.trim()) anuncios.push(item);
            });
            if (anuncios.length) { ANUNCIOS = anuncios; guardarEnCache('anuncios', ANUNCIOS); }
        });

        database.ref('configuracion/tiempoPantalla').once('value', snap => {
            if (snap.val()) {
                tiempoRotacionGlobal = parseInt(snap.val()) * 1000;
                guardarEnCache('tiempoRotacion', tiempoRotacionGlobal);
                if (rotationInterval && !enTransmisionVivo) {
                    clearInterval(rotationInterval);
                    rotationInterval = setInterval(rotateDisplay, tiempoRotacionGlobal);
                }
            }
        });
    }

    // ============================================
    // REAL NOCHE — desde sorteos_enloteria/resultados
    // ============================================
    function procesarRealNoche(data) {
        const arr = [];
        if (!data) return arr;
        const items = Array.isArray(data) ? data : Object.values(data);
        for (const s of items) {
            if (!s) continue;
            const nombre = (s.nombre || '').toLowerCase();
            if (!nombre.includes('real noche') && !nombre.includes('real_noche')) continue;
            if (!s.numeros || !Array.isArray(s.numeros) || s.numeros.length < 3) continue;
            if (!s.numeros[0] || s.numeros[0] === "") continue;
            arr.push({
                nombre: s.nombre,
                hora: (s.hora || '').replace(/(AM|PM)/i, ' $1').trim(),
                fechaRD: s.fechaRD || '',
                fecha: s.fecha || '',
                numeros: [s.numeros[0], s.numeros[1], s.numeros[2]],
                enviadoEn: s.enviadoEn || '',
                timestamp: s.enviadoEn ? new Date(s.enviadoEn).getTime() : 0
            });
        }
        arr.sort((a, b) => b.timestamp - a.timestamp);
        return arr;
    }

    function renderRealNoche() {
        const timeEl = document.getElementById('realTime');
        const ballsEl = document.getElementById('realBalls');
        const sidePanel = document.getElementById('sidePanelReal');
        const dateEl = document.getElementById('realDate');

            timeEl.innerText = '--:--';
            dateEl.innerText = '--';
            ballsEl.innerHTML = '<div class="waiting-text">ESPERANDO SORTEO DE REAL NOCHE...</div>';
            sidePanel.innerHTML = '<div class="waiting-text">NO HAY SORTEOS REGISTRADOS</div>';
            return;
        }

        const last = REAL_NOCHE_SORTEOS[0];
        const hoy = getFormatDate(0);
        const esHoy = last.fechaRD === hoy;

        timeEl.innerText = last.hora || '--:--';

        // Fecha grande abajo del sorteo principal
        if (last.fechaRD && last.fechaRD.includes('-')) {
            dateEl.innerText = formatearFechaLarga(last.fechaRD);
        } else {
            dateEl.innerText = last.fecha || '--';
        }

        // HOY → bolos AZULES | AYER/otro → bolos BLANCOS
        const ballClass = esHoy ? 'blue' : 'white';
        ballsEl.innerHTML = last.numeros.map((n, i) =>
            `<div class="ball-big ${ballClass}" style="animation-delay: ${i * 0.2}s">${n}</div>`
        ).join('');

        const historial = REAL_NOCHE_SORTEOS.slice(1, 6);
        if (!historial.length) {
            sidePanel.innerHTML = '<div class="waiting-text" style="color:white;">SOLO HAY UN SORTEO REGISTRADO</div>';
        } else {
            sidePanel.innerHTML = historial.map((s, idx) => {
                let label = s.fecha || '';
                if (s.fechaRD === hoy) label = 'HOY';
                else if (s.fechaRD === getFormatDate(1)) label = 'AYER';
                else if (s.fechaRD) {
                    const [y, m, d] = s.fechaRD.split('-');
                    label = `${d}/${m}/${y}`;
                }
                const smallClass = s.fechaRD === hoy ? '' : 'white';
                return `
                    <div class="side-row">
                        <div class="side-time">
                            ${s.hora}
                            <small style="font-size:18px; display:block; color:#64748b; font-weight:700; margin-top:2px;">${label}</small>
                        </div>
                        <div style="display:flex; gap:10px;">
                            <div class="ball-small ${smallClass}" style="animation-delay: ${idx * 0.1}s">${s.numeros[0]}</div>
                            <div class="ball-small ${smallClass}" style="animation-delay: ${idx * 0.1 + 0.15}s">${s.numeros[1]}</div>
                            <div class="ball-small ${smallClass}" style="animation-delay: ${idx * 0.1 + 0.30}s">${s.numeros[2]}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    }

    // ============================================
    // INICIALIZACIÓN DE DATOS
    // ============================================
    function inicializarDatos() {
        database.ref('ticker').on('value', snap => {
            const texto = snap.val() || "BIENVENIDOS A ANGUILLA LOTTERY";
            document.getElementById('marqueeText').innerText = texto;
            guardarEnCache('ticker', texto);
        });

        database.ref('configuracion/tiempoPantalla').on('value', snap => {
            if (snap.val()) {
                tiempoRotacionGlobal = parseInt(snap.val()) * 1000;
                guardarEnCache('tiempoRotacion', tiempoRotacionGlobal);
            }
        });

        database.ref('anunciosList').on('value', snap => {
            ANUNCIOS = [];
            const cacheContainer = document.getElementById('preloader-cache');
            cacheContainer.innerHTML = "";
            if (snap.exists()) snap.forEach(child => {
                let item = child.val();
                if (item?.activo !== false && item?.url?.trim()) {
                    ANUNCIOS.push(item);
                    let imgPre = new Image();
                    imgPre.src = convertirLinkGitHub(item.url.trim());
                    cacheContainer.appendChild(imgPre);
                }
            });
            guardarEnCache('anuncios', ANUNCIOS);
            if (adIndex >= ANUNCIOS.length) adIndex = 0;
        });

        const hoyStr = getFormatDate(0);
        const ayerStr = getFormatDate(1);

        database.ref(`sorteos/${hoyStr}`).on('value', snapHoy => {
            const dataHoy = snapHoy.val() || [];
            database.ref(`sorteos/${ayerStr}`).once('value', snapAyer => {
                const dataAyer = snapAyer.val() || [];
                const procesados = procesarSorteosData(dataHoy, dataAyer);
                if (procesados.length > 0) {
                    SORTEOS = ordenarSorteosCronologicamente(procesados);
                    guardarEnCache('sorteos', SORTEOS);
                }
                if (sistemaIniciado && !enTransmisionVivo) {
                    renderGrid();
                    if (currentView === 88) renderFeatured();
                }
            });
        });

        // REAL NOCHE — desde sorteos_enloteria/resultados
        database.ref('sorteos_enloteria/resultados').on('value', snap => {
            const data = snap.val();
            const procesados = procesarRealNoche(data);
            REAL_NOCHE_SORTEOS = procesados;
            guardarEnCache('realNoche', REAL_NOCHE_SORTEOS);
            console.log('🌙 Real Noche sorteos:', REAL_NOCHE_SORTEOS.length);
            if (sistemaIniciado && !enTransmisionVivo && currentView === 111) {
                renderRealNoche();
            }
        });

        database.ref('transmisionVivo').on('value', snap => {
            if (!sistemaIniciado) return;
            const live = snap.val();
            const vGrid = document.getElementById('view-grid');
            const vFeat = document.getElementById('view-featured');
            const vReal = document.getElementById('view-realenoche');
            const vAds = document.getElementById('view-ads');
            const boxAd = document.getElementById('adDisplay');
            const mainBoxArea = document.getElementById('adMainBox');
            const sidePanelAds = document.getElementById('sidePanelAds');

            if (live && live.activo === true) {
                enTransmisionVivo = true;
                clearInterval(rotationInterval);
                vGrid.classList.add('hidden');
                vFeat.classList.add('hidden');
                vReal.classList.add('hidden');
                vAds.classList.remove('hidden');

                sidePanelAds.style.display = "none";
                mainBoxArea.style.width = "100%";

                let rawUrl = live.url || "";
                if (esVideoDirecto(rawUrl)) {
                    let directUrl = convertirLinkGitHub(rawUrl);
                    boxAd.innerHTML = `<div class="live-indicator">● EN VIVO</div><video src="${directUrl}" autoplay muted playsinline controls style="width:100%; height:100%; background:#000;"></video>`;
                } else {
                    let embedUrl = rawUrl.replace("watch?v=", "embed/").replace("youtu.be/", "youtube.com/embed/");
                    if (embedUrl.includes("?")) embedUrl = embedUrl.split("?")[0];
                    boxAd.innerHTML = `<div class="live-indicator">● EN VIVO</div><iframe src="${embedUrl}?autoplay=1&mute=1&controls=0&rel=0" allow="autoplay; encrypted-media" style="width:100%; height:100%; border:none;"></iframe>`;
                }
            } else if (enTransmisionVivo) {
                enTransmisionVivo = false;
                boxAd.innerHTML = "";
                gridPage = 0; currentView = 0;
                sidePanelAds.style.display = "flex";
                mainBoxArea.style.width = "1190px";
                vGrid.classList.remove('hidden');
                vFeat.classList.add('hidden');
                vReal.classList.add('hidden');
                vAds.classList.add('hidden');
                renderGrid();
                clearInterval(rotationInterval);
                rotationInterval = setInterval(rotateDisplay, tiempoRotacionGlobal);
            }
        });
    }

    // ============================================
    // RENDER GRID / FEATURED / ADS
    // ============================================
    function renderGrid() {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';
        if (SORTEOS.length === 0) {
            grid.innerHTML = `<div style="grid-column:1/-1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; font-size:32px; font-weight:800; gap:20px;">
                <span>${usandoCache ? '📡 MODO OFFLINE' : '📡 ESPERANDO DATOS'}</span>
                <span style="font-size:20px; font-weight:400; opacity:0.7;">${usandoCache ? 'Cargando desde caché...' : 'No hay sorteos disponibles'}</span>
            </div>`;
            return;
        }
        const start = gridPage * 8;
        const pageItems = SORTEOS.slice(start, start + 8);

        pageItems.forEach((s, idx) => {
            const card = document.createElement('div');
            card.className = `card ${s.day === 'hoy' ? 'card-hoy' : 'card-ayer'}`;
            let bottom = s.isWaiting
                ? `<div class="waiting-text">ESPERANDO RESULTADOS...</div>`
                : `<div class="balls-container">
                    <div class="ball-flat" style="animation-delay: ${(idx * 0.1)}s">${s.nums ? s.nums[0] : '--'}</div>
                    <div class="ball-flat" style="animation-delay: ${(idx * 0.1 + 0.15)}s">${s.nums ? s.nums[1] : '--'}</div>
                    <div class="ball-flat" style="animation-delay: ${(idx * 0.1 + 0.30)}s">${s.nums ? s.nums[2] : '--'}</div>
                   </div>`;
            const cacheBadge = usandoCache ? `<div class="cached-badge">📦 CACHÉ</div>` : '';
            card.innerHTML = `<div class="card-header"><img class="mini-logo" src="anguilla.png"><div class="time-bar">${s.hour}</div><div class="date-tag">${s.date}</div></div>${bottom}${cacheBadge}`;
            grid.appendChild(card);
        });
    }

    function generarPanelLateral(contenedorId) {
        let jugados = SORTEOS.filter(s => s.nums?.length > 0);
        const panel = document.getElementById(contenedorId);
        if (jugados.length === 0) {
            panel.innerHTML = '<div class="waiting-text">NO HAY SORTEOS PREVIOS</div>';
            return SORTEOS[0] || { hour: '--:--', date: 'HOY', nums: null };
        }
        jugados.sort((a, b) => {
            if (a.day === b.day) return convertirHoraAminutos(b.hour) - convertirHoraAminutos(a.hour);
            return a.day === 'hoy' ? -1 : 1;
        });
        let last = jugados[0];
        const historial = jugados.slice(1, 6);
        panel.innerHTML = historial.map((s, idx) => `
            <div class="side-row">
                <div class="side-time">${s.hour} <small style="font-size:18px; display:block; color:#64748b; font-weight:700; margin-top:2px;">${s.date}</small></div>
                <div style="display:flex; gap:10px;">
                    <div class="ball-small" style="animation-delay: ${idx * 0.1}s">${s.nums[0]}</div>
                    <div class="ball-small" style="animation-delay: ${idx * 0.1 + 0.15}s">${s.nums[1]}</div>
                    <div class="ball-small" style="animation-delay: ${idx * 0.1 + 0.30}s">${s.nums[2]}</div>
                </div>
            </div>`).join('');
        return last;
    }

    function renderFeatured() {
        let last = generarPanelLateral('sidePanelFeatured');
        document.getElementById('fTime').innerText = last.hour;
        const fBalls = document.getElementById('fBalls');
        const fDate = document.getElementById('fDate');

        if (last.nums) {
            const esHoy = last.day === 'hoy';
            fBalls.innerHTML = last.nums.map((n, i) => `<div class="ball-big ${esHoy ? 'blue' : 'gray'}" style="animation-delay: ${i * 0.2}s">${n}</div>`).join('');
            // Fecha grande abajo
            if (esHoy) {
                fDate.innerText = formatearFechaLarga(0);
            } else {
                fDate.innerText = formatearFechaLarga(1);

            fBalls.innerHTML = '<div class="waiting-text">PROXIMO SORTEO</div>';
            fDate.innerText = formatearFechaLarga(0);

    function renderMediaAd() {
        generarPanelLateral('sidePanelAds');
        const box = document.getElementById('adDisplay');
        box.innerHTML = "";
        const activos = ANUNCIOS.filter(ad => ad.activo !== false);
        if (activos.length === 0) {
            const msg = usandoCache ? '📡 MODO OFFLINE - ANGUILLA LOTTERY' : 'ANGUILLA LOTTERY';
            box.innerHTML = `<div style='color:white; font-size:40px; font-weight:800; letter-spacing:1px;'>${msg}</div>`;
            return tiempoRotacionGlobal;
        }
        if (adIndex >= activos.length) adIndex = 0;
        const ad = activos[adIndex];
        let urlTarget = ad.url ? ad.url.trim() : "";
        let urlProcesada = convertirLinkGitHub(urlTarget);

        if (esVideoDirecto(urlTarget) && (urlTarget.includes('.mp4') || urlTarget.includes('.webm') || urlTarget.includes('.ogg') || urlTarget.includes('.mov') || urlTarget.includes('raw.githubusercontent'))) {
            box.innerHTML = `<video src="${urlProcesada}" autoplay muted playsinline style="width:100%; height:100%; object-fit:contain;"></video>`;
        } else if (urlTarget.includes('youtube.com') || urlTarget.includes('youtu.be')) {
            let embed = urlTarget.replace("watch?v=", "embed/").replace("youtu.be/", "youtube.com/embed/");
            if (embed.includes("?")) embed = embed.split("?")[0];
            box.innerHTML = `<iframe src="${embed}?autoplay=1&mute=1&controls=0&rel=0" allow="autoplay; encrypted-media" style="width:100%; height:100%; border:none;"></iframe>`;
        } else if (urlTarget !== "") {
            box.innerHTML = `<img src="${urlProcesada}" style="width:100%; height:100%; object-fit:contain;" onerror="this.style.display='none';this.parentElement.innerHTML='<div style=\\'color:white; font-size:40px; font-weight:800; letter-spacing:1px;\\'>ANGUILLA LOTTERY</div>';">`;
        } else {
            box.innerHTML = "<div style='color:white; font-size:40px; font-weight:800; letter-spacing:1px;'>ANGUILLA LOTTERY</div>";
        }

        let tiempoAsignado = (parseInt(ad.tiempo) || 15) * 1000;
        adIndex++;
        return tiempoAsignado;
    }

    // ============================================
    // ROTACIÓN
    // ============================================
    function rotateDisplay() {
        if (SORTEOS.length === 0 || enTransmisionVivo || !sistemaIniciado) return;
        clearInterval(rotationInterval);

        const vGrid = document.getElementById('view-grid');
        const vFeat = document.getElementById('view-featured');
        const vReal = document.getElementById('view-realenoche');
        const vAds = document.getElementById('view-ads');
        const totalPages = Math.max(1, Math.ceil(SORTEOS.length / 8));

        vGrid.classList.add('hidden');
        vFeat.classList.add('hidden');
        vReal.classList.add('hidden');
        vAds.classList.add('hidden');

        setTimeout(() => {
            let nextTime = tiempoRotacionGlobal;

            if (currentView < totalPages - 1) {
                gridPage++; currentView++;
                renderGrid();
                vGrid.classList.remove('hidden');
            } else if (currentView === totalPages - 1) {
                currentView = 88;
                renderFeatured();
                vFeat.classList.remove('hidden');
            } else if (currentView === 88) {
                currentView = 111;
                renderRealNoche();
                vReal.classList.remove('hidden');
            } else if (currentView === 111) {
                currentView = 99;
                nextTime = renderMediaAd();
                vAds.classList.remove('hidden');
            } else {
                gridPage = 0; currentView = 0;
                renderGrid();
                vGrid.classList.remove('hidden');
            }

            rotationInterval = setInterval(rotateDisplay, Math.max(1000, nextTime - 450));
        }, 450);
    }

    function updateDateTime() {
        const now = new Date();
        const hrs = now.getHours() % 12 || 12;
        const mins = now.getMinutes().toString().padStart(2, '0');
        const secs = now.getSeconds().toString().padStart(2, '0');
        const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
        document.getElementById('liveClock').innerText = `${hrs}:${mins}:${secs} ${ampm}`;
        const dias = ['DOMINGO', 'LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];
        const meses = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
        document.getElementById('currentDay').innerText = `${dias[now.getDay()]} ${now.getDate()}`;
        document.getElementById('currentMonth').innerText = `${meses[now.getMonth()]} ${now.getFullYear()}`;
    }

    window.onload = () => {
        dimensionarPantalla();
        updateDateTime();
        setInterval(updateDateTime, 1000);

        verificarConexion();
        monitorearConexion();
        cargarDesdeCache();
        inicializarDatos();

        setTimeout(() => { cargarDatosFirebase(); }, 1000);
        activarMantenerPantallaEncendida();

        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            sistemaIniciado = true;
            if (SORTEOS.length === 0) cargarDesdeCache();

            database.ref('transmisionVivo').once('value', snap => {
                const live = snap.val();
                if (live && live.activo === true) {
                    // mantener vista
                } else {
                    renderGrid();
                    rotationInterval = setInterval(rotateDisplay, tiempoRotacionGlobal);
                }
            });
        }, 2000);
    };

    function dimensionarPantalla() {
        const baseWidth = 1920, baseHeight = 1080;
        const elScale = Math.min(window.innerWidth / baseWidth, window.innerHeight / baseHeight);
        document.getElementById('canvas-master').style.transform = `translate(-50%, -50%) scale(${elScale})`;
    }
    window.addEventListener('resize', dimensionarPantalla);

    let wakeLock = null;
    async function activarMantenerPantallaEncendida() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                document.addEventListener('visibilitychange', async () => {
                    if (wakeLock !== null && document.visibilityState === 'visible') {
                        wakeLock = await navigator.wakeLock.request('screen');
                    }
                });
            }
        } catch (err) { console.error("WakeLock Error: ", err); }
    }
</script>
</body>
</html>
