<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Pizarra Anguillas | Bancas Kiko</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --azul-rey: #0033a0;
        --azul-oscuro: #001a4d;
        --rojo: #d90000;
        --dorado: #ffcc00;
        --blanco: #ffffff;
        --gris-fondo: #f4f7f6;
        --texto-oscuro: #1e293b;
        --texto-gris: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    /* FONDO AZUL PREMIUM 3D */
    html, body {
        height: 100dvh; width: 100dvw;
        overflow: hidden; margin: 0; padding: 0;
        background: radial-gradient(circle at 50% 0%, #0d2b6b 0%, #021133 100%);
    }

    /* SPLASH */
    #splash-screen {
        position: fixed; inset: 0;
        background: radial-gradient(circle at 50% 0%, #0d2b6b 0%, #021133 100%);
        z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity 1s ease-in-out, visibility 1s;
    }
    .splash-logo { height: 320px; object-fit: contain; animation: floating 3s ease-in-out infinite; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5)); }
    .splash-text { color: var(--blanco); font-size: 42px; font-weight: 900; margin-top: 40px; letter-spacing: 2px; }
    .splash-sub { color: var(--dorado); font-size: 24px; font-weight: 700; margin-top: 10px; letter-spacing: 4px; animation: pulse 1.5s alternate infinite; }

    /* CANVAS MASTER */
    #canvas-master {
        position: absolute; top: 50%; left: 50%;
        width: 1920px; height: 1080px;
        background: transparent;
        transform: translate(-50%, -50%);
        transform-origin: center center;
        overflow: hidden;
        will-change: transform;
        display: flex; flex-direction: column;
    }

    /* HEADER */
    .topbar {
        width: 100%; height: 110px;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 40px;
        background: rgba(0, 26, 77, 0.9);
        border-bottom: 6px solid var(--dorado);
        position: relative; z-index: 10;
        flex-shrink: 0;
        box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
    }
    .brand-area { display: flex; align-items: center; gap: 20px; height: 100%; }
    .brand-area img { height: 80px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }

    .header-message-box {
        display: flex; align-items: center; gap: 15px;
        padding: 12px 30px;
        background: rgba(255,255,255,0.05);
        border: 2px solid var(--dorado);
        border-radius: 50px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        flex: 1; max-width: 800px; margin-left: 20px;
    }
    .header-msg-icon { font-size: 36px; }
    .header-msg-main { font-size: 26px; font-weight: 900; color: var(--blanco); line-height: 1.1; }
    .header-msg-sub { font-size: 15px; font-weight: 700; color: var(--dorado); text-transform: uppercase; margin-top: 2px; }

    .header-info { display: flex; align-items: center; gap: 25px; }
    .header-clock { font-size: 55px; font-weight: 900; color: var(--blanco); border-right: 4px solid rgba(255, 204, 0, 0.4); padding-right: 25px; font-variant-numeric: tabular-nums; }
    .date-header { text-align: right; }
    .main-date { font-size: 28px; font-weight: 900; color: var(--dorado); text-transform: uppercase; }
    .sub-date { font-size: 16px; font-weight: 700; color: var(--blanco); }

    /* TICKER */
    .ticker-bar {
        width: 100%; height: 55px;
        background: var(--rojo);
        overflow: hidden; display: flex; align-items: center;
        border-bottom: 4px solid var(--dorado);
        flex-shrink: 0;
    }
    .ticker-text {
        white-space: nowrap; font-size: 24px; font-weight: 800; color: var(--blanco);
        animation: marquee 25s linear infinite; padding-left: 100%;
    }
    @keyframes marquee { 0% { transform: translate3d(0,0,0); } 100% { transform: translate3d(-100%,0,0); } }

    /* VISTAS */
    #view-grid, #view-featured, #view-ads {
        flex: 1; padding: 25px 30px;
        position: relative; opacity: 1; visibility: visible;
        transition: opacity 0.4s ease, visibility 0.4s;
        overflow: hidden;
    }
    .hidden { opacity: 0 !important; visibility: hidden !important; position: absolute !important; inset: 0 !important; pointer-events: none; }
    #view-ads { padding: 0; background: #000; }

    /* ============================================ */
    /* VISTA 1: GRID (8 SORTEOS)                    */
    /* ============================================ */
    .grid-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 25px;
        height: 100%;
    }
    .card {
        background: var(--blanco);
        border-radius: 25px;
        padding: 20px;
        display: flex; flex-direction: column;
        align-items: center; justify-content: space-between;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        border-top: 8px solid var(--dorado);
        position: relative;
        animation: dropIn 0.5s ease-out both;
    }
    .card.proximo {
        border-top-color: var(--rojo);
        box-shadow: 0 0 40px rgba(217, 0, 0, 0.6);
        transform: scale(1.02);
        z-index: 5;
    }

    .card-logo { height: 75px; object-fit: contain; margin-bottom: 5px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
    .card-nombre { font-weight: 900; font-size: 22px; color: var(--azul-rey); text-transform: uppercase; text-align: center; }

    .card-fecha {
        font-size: 14px; font-weight: 900; color: #15803d; background: #dcfce7;
        padding: 4px 15px; border-radius: 20px; margin-bottom: 15px;
    }
    .card-fecha.ayer { color: var(--rojo); background: #fee2e2; }
    .card-fecha.proximo-label { color: white; background: var(--rojo); animation: pulse 1.5s infinite; }

    .bolos-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
    .bolo {
        width: 100px; height: 100px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-weight: 900; font-size: 48px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        box-shadow: inset -6px -6px 15px rgba(0,0,0,0.1), inset 5px 5px 12px rgba(255,255,255,0.6), 0 8px 20px rgba(0,0,0,0.15);
    }
    .bolo.hoy { background: radial-gradient(circle at 30% 30%, #60a5fa, #1e40af); color: white; }
    .bolo.ayer { background: radial-gradient(circle at 30% 30%, #ffffff, #cbd5e1); color: var(--azul-oscuro); }

    .card-timer {
        font-size: 20px; font-weight: 900; color: var(--rojo); background: #fee2e2;
        padding: 5px 15px; border-radius: 10px; margin-bottom: 15px; font-variant-numeric: tabular-nums;
    }

    .card-footer {
        width: 100%; display: flex; justify-content: space-between; align-items: center;
        background: var(--gris-fondo); padding: 10px 18px; border-radius: 15px;
        font-size: 15px; font-weight: 800; color: var(--texto-gris);
    }
    .card-footer .time { color: var(--azul-rey); font-size: 22px; font-weight: 900; }

    /* ============================================ */
    /* VISTA 2: DESTACADOS (Split)                  */
    /* ============================================ */
    .split-container { display: flex; gap: 25px; height: 100%; width: 100%; }

    .split-main {
        flex: 1;
        background: var(--blanco);
        border: 6px solid var(--dorado);
        border-radius: 35px; display: flex; flex-direction: column; align-items: center;
        justify-content: center; padding: 40px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    .dest-logo { height: 280px; margin-bottom: 20px; object-fit: contain; }
    .dest-nombre { font-size: 48px; font-weight: 900; color: var(--azul-rey); margin-bottom: 10px; text-transform: uppercase; }

    .dest-hora-box {
        font-size: 80px; background: linear-gradient(135deg, #fbbf24 0%, #f97316 50%, #fbbf24 100%);
        color: #ffffff; padding: 10px 80px; border-radius: 25px; font-weight: 900;
        letter-spacing: 2px; text-shadow: 0 4px 12px rgba(0,0,0,0.6);
        box-shadow: 0 15px 40px rgba(0,0,0,0.3); margin-bottom: 40px;
    }

    .dest-bolos { display: flex; justify-content: center; gap: 30px; margin-bottom: 30px; }
    .dest-bolo {
        width: 240px; height: 240px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 120px; font-weight: 900; color: white;
        background: radial-gradient(circle at 30% 30%, #60a5fa, #1e40af);
        box-shadow: inset -12px -12px 30px rgba(0,0,0,0.3), inset 10px 10px 25px rgba(255,255,255,0.5), 0 20px 40px rgba(0,0,0,0.25);
    }

    .side-panel { width: 550px; display: flex; flex-direction: column; gap: 15px; }
    .side-row {
        background: var(--blanco); border-radius: 20px; padding: 10px 20px;
        display: flex; justify-content: space-between; align-items: center;
        border-left: 10px solid var(--dorado);
        box-shadow: 0 5px 15px rgba(0,0,0,0.3); flex: 1;
    }
    .side-left { display: flex; align-items: center; gap: 15px; }
    .side-logo { height: 60px; object-fit: contain; }
    .side-info { display: flex; flex-direction: column; }
    .side-info .hora { color: var(--azul-oscuro); font-size: 24px; font-weight: 900; }
    .side-info .fecha { color: var(--texto-gris); font-size: 13px; font-weight: 700; text-transform: uppercase; }
    .side-bolos { display: flex; gap: 8px; }
    .side-bolo {
        width: 55px; height: 55px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 26px; font-weight: 900;
        box-shadow: inset -4px -4px 10px rgba(0,0,0,0.1), inset 3px 3px 8px rgba(255,255,255,0.6), 0 4px 10px rgba(0,0,0,0.15);
    }
    .side-bolo.hoy { background: radial-gradient(circle at 30% 30%, #60a5fa, #1e40af); color: white; }
    .side-bolo.ayer { background: radial-gradient(circle at 30% 30%, #ffffff, #cbd5e1); color: var(--azul-oscuro); }

    /* VISTA ADS */
    .ad-box { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; position: relative; }
    .ad-box img, .ad-box video { width: 100%; height: 100%; object-fit: contain; }
    .ad-box iframe { width: 100%; height: 100%; border: none; }

    .live-indicator {
        position: absolute; top: 25px; left: 25px;
        background: #e63946; color: #fff; font-size: 24px; font-weight: 900;
        padding: 8px 24px; border-radius: 8px; box-shadow: 0 0 20px #e63946;
        letter-spacing: 1.5px; z-index: 50; display: inline-flex; align-items: center; gap: 8px;
    }

    @keyframes dropIn {
        0% { opacity: 0; transform: scale(0.8) translateY(10px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes pulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }
    @keyframes floating { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
</style>
</head>
<body>

<div id="splash-screen">
    <img src="nuevologo.png" class="splash-logo" alt="Bancas Kiko">
    <div class="splash-text">INICIANDO PIZARRA</div>
    <div class="splash-sub">CONECTANDO A FIREBASE...</div>
</div>

<div id="canvas-master">
    <!-- TOPBAR -->
    <div class="topbar">
        <div class="brand-area">
            <img src="nuevologo.png" alt="Bancas Kiko">
            <div class="header-message-box">
                <div class="header-msg-icon" id="headerMsgIcon">🍀</div>
                <div>
                    <div class="header-msg-main" id="headerMsgMain">¡LA SUERTE TE ESPERA!</div>
                    <div class="header-msg-sub" id="headerMsgSub">Juega con responsabilidad</div>
                </div>
            </div>
        </div>
        <div class="header-info">
            <div class="header-clock" id="liveClock">00:00:00</div>
            <div class="date-header">
                <div class="main-date" id="currentDay">...</div>
                <div class="sub-date" id="currentMonth">...</div>
            </div>
        </div>
    </div>

    <!-- TICKER -->
    <div class="ticker-bar">
        <div class="ticker-text" id="marqueeText">CARGANDO ANUNCIOS...</div>
    </div>

    <!-- VISTAS -->
    <div id="view-grid">
        <div class="grid-container" id="mainGrid"></div>
    </div>

    <div id="view-featured" class="hidden">
        <div class="split-container">
            <div class="split-main" id="featuredMain"></div>
            <div class="side-panel" id="featuredSide"></div>
        </div>
    </div>

    <div id="view-ads" class="hidden">
        <div class="ad-box" id="adDisplay"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
    // ✅ FIREBASE DEL PRIMER CÓDIGO
    const firebaseConfig = { databaseURL: "https://pizarra-loteria-36ba5-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let SORTEOS = [];
    let ANUNCIOS = [];
    let LOGOS = {};
    let CONFIG = { tiempoGrid: 15000 };

    let currentView = 'grid';
    let gridPage = 0;
    let adIndex = 0;
    let rotationTimer = null;
    let gridTimerInterval = null;
    let adTimer = null;
    let enTransmisionVivo = false;
    let sistemaIniciado = false;

    // ============================================
    // HELPERS
    // ============================================
    function getFormatDate(offset = 0) {
        const d = new Date();
        d.setDate(d.getDate() - offset);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function getLogo() {
        if (LOGOS['Anguilla'] || LOGOS['anguilla']) return LOGOS['Anguilla'] || LOGOS['anguilla'];
        return 'anguilla.png';
    }

    function convertirLinkGitHub(url) {
        if (!url) return url;
        if (url.includes('raw.githubusercontent.com')) return url;
        if (url.includes('github.com') && url.includes('/blob/')) return url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
        return url;
    }

    function esVideoDirecto(url) {
        if (!url) return false;
        const u = url.toLowerCase();
        return u.includes('.mp4') || u.includes('.webm') || u.includes('.ogg') || u.includes('.mov') || u.includes('raw.githubusercontent');
    }

    function convertirHoraAminutos(horaStr) {
        if (!horaStr) return 0;
        const match = horaStr.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
        if (!match) return 0;
        let h = parseInt(match[1]);
        const m = parseInt(match[2]);
        const ampm = match[3].toUpperCase();
        if (ampm === 'PM' && h !== 12) h += 12;
        if (ampm === 'AM' && h === 12) h = 0;
        return h * 60 + m;
    }

    // ============================================
    // PROCESAR SORTEOS (mantiene el nombre de cada sorteo)
    // ============================================
    function procesarAnguillas(data) {
        const arr = [];
        if (!data) return arr;

        const items = Array.isArray(data) ? data : Object.values(data);
        const hoyStr = getFormatDate(0);
        const ayerStr = getFormatDate(1);

        for (const s of items) {
            if (!s) continue;
            const nombre = (s.nombre || '').toLowerCase();
            if (!nombre.includes('anguilla')) continue;

            const nums = s.numeros || s.premios;
            if (!nums || !Array.isArray(nums) || nums.length < 3) continue;
            if (!nums[0] || nums[0] === '') continue;

            let estado = 'hoy';
            let dayLabel = 'HOY';

            if (s.fechaRD === ayerStr) {
                estado = 'ayer';
                dayLabel = 'AYER';
            } else if (s.fechaRD && s.fechaRD !== hoyStr) {
                estado = 'ayer';
                dayLabel = s.fecha || 'ANTERIOR';
            }

            const horaRaw = s.hora || '';
            const horaFormateada = horaRaw.replace(/\s+/g, '').replace(/(AM|PM)/i, ' $1').toUpperCase();

            arr.push({
                // ✅ nombre completo de cada sorteo (Anguilla Mañana, Anguilla Tarde, etc.)
                nombre: s.nombre || 'Anguilla',
                hora: horaFormateada,
                horaMin: convertirHoraAminutos(horaFormateada),
                numeros: [String(nums[0]).padStart(2,'0'), String(nums[1]).padStart(2,'0'), String(nums[2]).padStart(2,'0')],
                estado: estado,
                day: dayLabel,
                fechaRD: s.fechaRD || ''
            });
        }

        arr.sort((a, b) => a.horaMin - b.horaMin);

        const unicasPorHora = new Map();
        arr.forEach(s => {
            const key = s.hora;
            if (!unicasPorHora.has(key)) {
                unicasPorHora.set(key, s);
            } else {
                if (unicasPorHora.get(key).estado === 'ayer' && s.estado === 'hoy') {
                    unicasPorHora.set(key, s);
                }
            }
        });

        return Array.from(unicasPorHora.values());
    }

    // ============================================
    // VISTA 1: RENDERIZADO GRID CON PAGINACIÓN
    // ============================================
    function renderGrid() {
        clearInterval(gridTimerInterval);
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';

        if (SORTEOS.length === 0) {
            grid.innerHTML = `<div style="grid-column:1/-1; color:white; font-size:32px; font-weight:800; text-align:center; padding:50px;">ESPERANDO DATOS...</div>`;
            return;
        }

        const ahora = new Date();
        const minutosAhora = ahora.getHours() * 60 + ahora.getMinutes();

        let proximoIndex = SORTEOS.findIndex(s => {
            if (s.estado !== 'ayer') return false;
            const dif = s.horaMin - minutosAhora;
            return dif >= 0 && dif <= 20;
        });

        let ordenados = [...SORTEOS];

        if (proximoIndex !== -1) {
            const proximo = ordenados.splice(proximoIndex, 1)[0];
            ordenados.unshift(proximo);
        } else {
            const jugados = SORTEOS.filter(s => s.estado === 'hoy').reverse();
            const noJugados = SORTEOS.filter(s => s.estado === 'ayer');
            ordenados = [...jugados, ...noJugados];
        }

        const itemsPorPagina = 8;
        const totalPaginas = Math.ceil(ordenados.length / itemsPorPagina);
        if (gridPage >= totalPaginas) gridPage = 0;

        const inicio = gridPage * itemsPorPagina;
        const itemsAMostrar = ordenados.slice(inicio, inicio + itemsPorPagina);

        itemsAMostrar.forEach((s, idx) => {
            const esProximo = idx === 0 && gridPage === 0 && s.estado === 'ayer' && (s.horaMin - minutosAhora) >= 0 && (s.horaMin - minutosAhora) <= 20;

            const boloClass = s.estado === 'ayer' ? 'ayer' : 'hoy';
            let etiquetaClase = s.estado === 'ayer' ? 'ayer' : '';
            let etiquetaTexto = s.estado === 'ayer' ? `ÚLTIMO (${s.day})` : 'HOY';

            if (esProximo) {
                etiquetaClase = 'proximo-label';
                etiquetaTexto = '¡POR SALIR!';
            }

            const card = document.createElement('div');
            card.className = `card ${esProximo ? 'proximo' : ''}`;
            card.style.animationDelay = `${idx * 0.05}s`;

            const timerHtml = esProximo ? `<div class="card-timer" id="gridTimer">⏱ ...</div>` : '';

            card.innerHTML = `
                <div style="text-align:center; width:100%;">
                    <img class="card-logo" src="${getLogo()}" onerror="this.src='anguilla.png'">
                    <div class="card-nombre">${s.nombre}</div>
                    <div class="card-fecha ${etiquetaClase}">${etiquetaTexto}</div>
                </div>
                ${timerHtml}
                <div class="bolos-container">
                    <div class="bolo ${boloClass}">${s.numeros[0]}</div>
                    <div class="bolo ${boloClass}">${s.numeros[1]}</div>
                    <div class="bolo ${boloClass}">${s.numeros[2]}</div>
                </div>
                <div class="card-footer">
                    <span>${s.nombre}</span>
                    <span class="time">${s.hora}</span>
                </div>
            `;
            grid.appendChild(card);
        });

        if (proximoIndex !== -1) {
            iniciarGridTimer(ordenados[0].hora);
        }
    }

    function iniciarGridTimer(horaSorteo) {
        const el = document.getElementById('gridTimer');
        if (!el) return;

        const match = horaSorteo.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
        if (!match) return;

        let hSorteo = parseInt(match[1]);
        const mSorteo = parseInt(match[2]);
        const ampm = match[3].toUpperCase();
        if (ampm === 'PM' && hSorteo !== 12) hSorteo += 12;
        if (ampm === 'AM' && hSorteo === 12) hSorteo = 0;

        gridTimerInterval = setInterval(() => {
            const ahora = new Date();
            const sorteoDate = new Date();
            sorteoDate.setHours(hSorteo, mSorteo, 0, 0);

            let diff = sorteoDate - ahora;

            if (diff <= 0) {
                el.innerHTML = `⏳ SORTEANDO...`;
                return;
            }

            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const sec = Math.floor((diff % (1000 * 60)) / 1000);
            el.innerHTML = `⏱ Faltan ${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }, 1000);
    }

    // ============================================
    // VISTA 2: ÚLTIMO SORTEO Y 5 ANTERIORES
    // ============================================
    function renderFeatured() {
        const mainCont = document.getElementById('featuredMain');
        const sideCont = document.getElementById('featuredSide');

        const jugadosHoy = SORTEOS.filter(s => s.estado === 'hoy');
        const ultimo = jugadosHoy.length > 0 ? jugadosHoy[jugadosHoy.length - 1] : SORTEOS[0];

        if (!ultimo) {
            mainCont.innerHTML = `<div style="color:var(--rojo); font-size:30px; font-weight:900;">ESPERANDO SORTEOS...</div>`;
            return;
        }

        mainCont.innerHTML = `
            <img class="dest-logo" src="${getLogo()}" onerror="this.src='anguilla.png'">
            <div class="dest-nombre">${ultimo.nombre}</div>
            <div class="dest-hora-box">${ultimo.hora}</div>
            <div class="dest-bolos">
                <div class="dest-bolo">${ultimo.numeros[0]}</div>
                <div class="dest-bolo">${ultimo.numeros[1]}</div>
                <div class="dest-bolo">${ultimo.numeros[2]}</div>
            </div>
            <div style="background:#dcfce7; color:#15803d; padding:10px 30px; border-radius:20px; font-weight:900; font-size:24px;">
                ÚLTIMO SORTEO REALIZADO
            </div>
        `;

        sideCont.innerHTML = '';
        const indexUltimo = SORTEOS.findIndex(s => s.hora === ultimo.hora);
        let anteriores = [];
        for (let i = indexUltimo - 1; i >= 0; i--) {
            anteriores.push(SORTEOS[i]);
            if (anteriores.length === 5) break;
        }

        anteriores.forEach(s => {
            const boloClass = s.estado === 'ayer' ? 'ayer' : 'hoy';
            sideCont.innerHTML += `
                <div class="side-row">
                    <div class="side-left">
                        <img class="side-logo" src="${getLogo()}" onerror="this.src='anguilla.png'">
                        <div class="side-info">
                            <span class="hora">${s.hora}</span>
                            <span class="fecha">${s.nombre} · ${s.estado === 'hoy' ? 'HOY' : `(${s.day})`}</span>
                        </div>
                    </div>
                    <div class="side-bolos">
                        <div class="side-bolo ${boloClass}">${s.numeros[0]}</div>
                        <div class="side-bolo ${boloClass}">${s.numeros[1]}</div>
                        <div class="side-bolo ${boloClass}">${s.numeros[2]}</div>
                    </div>
                </div>
            `;
        });
    }

    // ============================================
    // RENDERIZADO ADS
    // ============================================
    function mostrarUnAnuncio() {
        clearTimeout(adTimer);

        const box = document.getElementById('adDisplay');
        box.innerHTML = '';
        if (ANUNCIOS.length === 0) {
            box.innerHTML = `<div style="color:white; font-size:60px; font-weight:800;">BANCAS KIKO</div>`;
            return;
        }

        if (adIndex >= ANUNCIOS.length) adIndex = 0;

        const ad = ANUNCIOS[adIndex];
        const url = (ad.url || '').trim();
        const urlProc = convertirLinkGitHub(url);

        if (esVideoDirecto(url)) {
            box.innerHTML = `<video src="${urlProc}" autoplay muted playsinline preload="auto" style="width:100%;height:100%;object-fit:contain;"></video>`;
        } else if (url.includes('youtube.com') || url.includes('youtu.be')) {
            let embed = url.replace('watch?v=', 'embed/').replace('youtu.be/', 'youtube.com/embed/');
            if (embed.includes('?')) embed = embed.split('?')[0];
            box.innerHTML = `<iframe src="${embed}?autoplay=1&mute=1&controls=0&rel=0" allow="autoplay; encrypted-media" style="width:100%;height:100%;border:none;"></iframe>`;
        } else if (url) {
            box.innerHTML = `<img src="${urlProc}" style="width:100%;height:100%;object-fit:contain;background:#000;">`;
        } else {
            box.innerHTML = `<div style="color:white; font-size:60px; font-weight:800;">BANCAS KIKO</div>`;
        }

        const tiempoAsignado = (parseInt(ad.tiempo) || 10) * 1000;
        adIndex++;

        adTimer = setTimeout(() => {
            if (currentView === 'ads') mostrarUnAnuncio();
        }, tiempoAsignado);
    }

    // ============================================
    // ROTACIÓN DE VISTAS (solo grid → featured → ads)
    // ============================================
    function mostrarVista(nombre) {
        document.querySelectorAll('#view-grid, #view-featured, #view-ads').forEach(el => el.classList.add('hidden'));
        document.getElementById('view-' + nombre).classList.remove('hidden');
        currentView = nombre;
    }

    function rotateDisplay() {
        if (enTransmisionVivo || !sistemaIniciado) return;

        clearTimeout(rotationTimer);
        clearInterval(gridTimerInterval);
        clearTimeout(adTimer);

        if (currentView === 'grid') {
            const totalPaginas = Math.ceil(SORTEOS.length / 8);
            if (gridPage < totalPaginas - 1) {
                gridPage++;
                renderGrid();
                rotationTimer = setTimeout(rotateDisplay, CONFIG.tiempoGrid);
            } else {
                gridPage = 0;
                mostrarVista('featured');
                renderFeatured();
                rotationTimer = setTimeout(rotateDisplay, 15000);
            }
        } else if (currentView === 'featured') {
            mostrarVista('ads');
            mostrarUnAnuncio();

            rotationTimer = setTimeout(() => {
                clearTimeout(adTimer);
                mostrarVista('grid');
                renderGrid();
                rotationTimer = setTimeout(rotateDisplay, CONFIG.tiempoGrid);
            }, 30000);
        } else {
            gridPage = 0;
            mostrarVista('grid');
            renderGrid();
            rotationTimer = setTimeout(rotateDisplay, CONFIG.tiempoGrid);
        }
    }

    // ============================================
    // RELOJ Y MENSAJES
    // ============================================
    function updateDateTime() {
        const now = new Date();
        const hrs = now.getHours() % 12 || 12;
        const mins = String(now.getMinutes()).padStart(2,'0');
        const secs = String(now.getSeconds()).padStart(2,'0');
        const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
        document.getElementById('liveClock').innerText = `${hrs}:${mins}:${secs} ${ampm}`;
        const dias = ['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
        const meses = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
        document.getElementById('currentDay').innerText = `${dias[now.getDay()]} ${now.getDate()}`;
        document.getElementById('currentMonth').innerText = `${meses[now.getMonth()]} ${now.getFullYear()}`;
    }

    const HEADER_MESSAGES = [
        { icon:'🍀', msg:'¡LA SUERTE TE ESPERA!', sub:'Juega con responsabilidad' },
        { icon:'💰', msg:'PAGAMOS A TIEMPO', sub:'Tu dinero está seguro' },
        { icon:'🎰', msg:'MÁS SORTEOS EN VIVO', sub:'Síguenos cada día' },
        { icon:'⭐', msg:'BANCAS KIKO', sub:'La confianza en tu jugada' },
        { icon:'🏆', msg:'GRANDES PREMIOS', sub:'Tú puedes ser el ganador' }
    ];
    let hIdx = 0;
    function cambiarMensajeHeader() {
        const m = HEADER_MESSAGES[hIdx % HEADER_MESSAGES.length];
        document.getElementById('headerMsgIcon').textContent = m.icon;
        document.getElementById('headerMsgMain').textContent = m.msg;
        document.getElementById('headerMsgSub').textContent = m.sub;
        hIdx++;
    }

    // ============================================
    // DATOS FIREBASE
    // ============================================
    function inicializarDatos() {
        database.ref('ticker').on('value', snap => {
            document.getElementById('marqueeText').innerText = snap.val() || 'BIENVENIDOS A BANCAS KIKO';
        });

        database.ref('configuracion/tiempoPantalla').on('value', snap => {
            if (snap.val()) CONFIG.tiempoGrid = parseInt(snap.val()) * 1000;
        });

        database.ref('anunciosList').on('value', snap => {
            ANUNCIOS = [];
            if (snap.exists()) snap.forEach(child => {
                const v = child.val();
                if (v?.activo !== false && v?.url?.trim()) ANUNCIOS.push(v);
            });
        });

        database.ref('web_kiko/logos').on('value', snap => {
            LOGOS = snap.val() || {};
            if (sistemaIniciado && !enTransmisionVivo) {
                if (currentView === 'grid') renderGrid();
                if (currentView === 'featured') renderFeatured();
            }
        });

        database.ref('sorteos_enloteria/resultados').on('value', snap => {
            SORTEOS = procesarAnguillas(snap.val());
            if (sistemaIniciado && !enTransmisionVivo) {
                if (currentView === 'grid') renderGrid();
                if (currentView === 'featured') renderFeatured();
            }
        });

        database.ref('transmisionVivo').on('value', snap => {
            if (!sistemaIniciado) return;
            const live = snap.val();
            if (live && live.activo === true) {
                enTransmisionVivo = true;
                clearTimeout(rotationTimer);
                clearInterval(gridTimerInterval);
                clearTimeout(adTimer);
                mostrarVista('ads');
                const box = document.getElementById('adDisplay');
                let rawUrl = live.url || "";
                if (esVideoDirecto(rawUrl)) {
                    box.innerHTML = `<div class="live-indicator">● EN VIVO</div><video src="${convertirLinkGitHub(rawUrl)}" autoplay muted playsinline controls style="width:100%;height:100%;background:#000;"></video>`;
                } else {
                    let embed = rawUrl.replace("watch?v=", "embed/").replace("youtu.be/", "youtube.com/embed/");
                    if (embed.includes("?")) embed = embed.split("?")[0];
                    box.innerHTML = `<div class="live-indicator">● EN VIVO</div><iframe src="${embed}?autoplay=1&mute=1&controls=0&rel=0" allow="autoplay; encrypted-media" style="width:100%;height:100%;border:none;"></iframe>`;
                }
            } else if (enTransmisionVivo) {
                enTransmisionVivo = false;
                document.getElementById('adDisplay').innerHTML = '';
                mostrarVista('grid');
                renderGrid();
                rotationTimer = setTimeout(rotateDisplay, CONFIG.tiempoGrid);
            }
        });
    }

    // ============================================
    // ESCALADO
    // ============================================
    function dimensionarPantalla() {
        const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        document.getElementById('canvas-master').style.transform = `translate(-50%,-50%) scale(${scale})`;
    }

    // ============================================
    // INIT
    // ============================================
    window.onload = () => {
        dimensionarPantalla();
        updateDateTime();
        setInterval(updateDateTime, 1000);
        setInterval(cambiarMensajeHeader, 5000);
        cambiarMensajeHeader();

        inicializarDatos();

        setTimeout(() => {
            const sp = document.getElementById('splash-screen');
            sp.style.opacity = '0';
            sp.style.visibility = 'hidden';
            sistemaIniciado = true;
            mostrarVista('grid');
            renderGrid();
            rotationTimer = setTimeout(rotateDisplay, CONFIG.tiempoGrid);
        }, 1500);
    };

    window.addEventListener('resize', dimensionarPantalla);
    window.addEventListener('orientationchange', dimensionarPantalla);
</script>
</body>
</html>
