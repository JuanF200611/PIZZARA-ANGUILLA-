<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Pizarra Anguilla | Bancas Kiko</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --azul-rey: #0033a0;
        --azul-oscuro: #001a4d;
        --rojo: #d90000;
        --dorado: #ffcc00;
        --blanco: #ffffff;
        --gris-fondo: #f4f7f6;
        --texto-oscuro: #1e293b;
        --texto-gris: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    html, body {
        height: 100dvh; width: 100dvw;
        overflow: hidden;
        background: radial-gradient(circle at 50% 0%, #0d2b6b 0%, #021133 100%);
    }

    /* NIEVE */
    #snow-container {
        position: fixed; inset: 0;
        pointer-events: none; z-index: 100000;
        overflow: hidden; display: none;
    }
    .snowflake {
        position: absolute; top: -20px; color: white;
        opacity: 0.85;
        animation: fall linear infinite;
        text-shadow: 0 0 6px rgba(255,255,255,0.6);
    }
    @keyframes fall { to { transform: translateY(110vh); } }

    /* SPLASH */
    #splash-screen {
        position: fixed; inset: 0;
        background: radial-gradient(circle at 50% 0%, #0d2b6b 0%, #021133 100%);
        z-index: 999999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity 1s ease-in-out, visibility 1s;
    }
    .splash-logo { height: min(320px, 40vh); object-fit: contain; animation: floating 3s ease-in-out infinite; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5)); }
    .splash-text { color: var(--blanco); font-size: clamp(24px, 3vw, 42px); font-weight: 900; margin-top: 40px; letter-spacing: 2px; }
    .splash-sub { color: var(--dorado); font-size: clamp(16px, 1.6vw, 24px); font-weight: 700; margin-top: 10px; letter-spacing: 4px; animation: pulse 1.5s alternate infinite; }

    /* CANVAS MASTER */
    #canvas-master {
        position: absolute; top: 50%; left: 50%;
        width: 1920px; height: 1080px;
        background: transparent;
        transform: translate(-50%, -50%) scale(1);
        transform-origin: center center;
        overflow: hidden;
        will-change: transform;
        display: flex; flex-direction: column;
    }

    /* HEADER */
    .topbar {
        width: calc(100% - 30px);
        margin: 10px 15px 0 15px;
        height: 100px;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 30px;
        background: linear-gradient(90deg, rgba(0, 26, 77, 0.95) 0%, rgba(0, 51, 160, 0.95) 100%);
        border-radius: 20px;
        border-bottom: 4px solid var(--dorado);
        position: relative; z-index: 5;
        flex-shrink: 0;
        box-shadow: 0 8px 25px rgba(0,0,0,0.45);
        backdrop-filter: blur(10px);
    }
    .brand-area { display: flex; align-items: center; gap: 16px; height: 100%; }
    .brand-area img { height: 72px; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.55)); }
    .brand-text { display: flex; flex-direction: column; justify-content: center; line-height: 1; }
    .brand-title { font-size: 26px; font-weight: 900; color: var(--blanco); letter-spacing: 0.5px; text-transform: uppercase; text-shadow: 0 2px 8px rgba(0,0,0,0.5); white-space: nowrap; }
    .brand-title span { color: var(--dorado); }
    .brand-slogan { font-size: 12px; font-weight: 600; color: #cbd5e1; letter-spacing: 1.6px; text-transform: uppercase; margin-top: 5px; white-space: nowrap; }

    .header-info { display: flex; align-items: center; gap: 25px; }
    .header-clock { font-size: 52px; font-weight: 900; color: var(--blanco); border-right: 4px solid rgba(255, 204, 0, 0.4); padding-right: 25px; font-variant-numeric: tabular-nums; }
    .date-header { text-align: right; }
    .main-date { font-size: 26px; font-weight: 900; color: var(--dorado); text-transform: uppercase; }
    .sub-date { font-size: 15px; font-weight: 700; color: var(--blanco); }

    /* TICKER */
    .ticker-bar {
        width: calc(100% - 30px);
        margin: 8px 15px 0 15px;
        height: 52px;
        background: var(--rojo);
        border-radius: 14px;
        overflow: hidden; display: flex; align-items: center;
        border-bottom: 4px solid var(--dorado);
        flex-shrink: 0;
        position: relative; z-index: 5;
        box-shadow: 0 4px 15px rgba(0,0,0,0.35);
    }
    .ticker-text {
        white-space: nowrap; font-size: 24px; font-weight: 800; color: var(--blanco);
        animation: marquee 25s linear infinite; padding-left: 100%;
    }
    @keyframes marquee { 0% { transform: translate3d(0,0,0); } 100% { transform: translate3d(-100%,0,0); } }

    /* VISTAS */
    #view-grid, #view-featured, #view-ads, #view-live {
        flex: 1; padding: 15px 25px;
        position: relative; opacity: 1; visibility: visible;
        transition: opacity 0.4s ease, visibility 0.4s;
        overflow: hidden;
    }
    .hidden { opacity: 0 !important; visibility: hidden !important; position: absolute !important; inset: 0 !important; pointer-events: none; }
    #view-ads, #view-live { padding: 0; background: #000; }

    /* ============================================================
       BRANDING
       ============================================================ */
    #view-branding {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 99999 !important;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 30%, #0d2b6b 0%, #021133 100%);
        padding: 20px; text-align: center;
        opacity: 1; visibility: visible; transition: opacity 0.4s ease, visibility 0.4s;
    }
    #view-branding.hidden { opacity: 0 !important; visibility: hidden !important; pointer-events: none; }
    .branding-logo { height: min(450px, 50vh); max-width: 90vw; object-fit: contain; animation: floating 3.5s ease-in-out infinite; filter: drop-shadow(0 25px 50px rgba(0,0,0,0.7)); }
    .branding-title { font-size: clamp(42px, 6vw, 96px); font-weight: 900; color: var(--blanco); margin-top: 30px; letter-spacing: 4px; text-shadow: 0 6px 20px rgba(0,0,0,0.7); line-height: 1; }
    .branding-title span { color: var(--dorado); }
    .branding-slogan { font-size: clamp(18px, 2.4vw, 38px); font-weight: 700; color: var(--dorado); margin-top: 20px; letter-spacing: 8px; animation: pulse 2s infinite alternate; text-align: center; }
    .branding-tag { margin-top: 40px; font-size: clamp(16px, 1.8vw, 28px); font-weight: 800; color: #cbd5e1; background: rgba(0,0,0,0.4); padding: 16px 50px; border-radius: 50px; border: 2px solid rgba(255,204,0,0.5); text-align: center; backdrop-filter: blur(4px); }

    /* GRID (Ajustado para que no se desborde) */
    .grid-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 20px;
        height: 100%;
    }
    .card {
        background: var(--blanco);
        border-radius: 25px;
        padding: 15px;
        display: flex; flex-direction: column;
        align-items: center; justify-content: space-between;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        border-top: 8px solid var(--dorado);
        position: relative;
        animation: dropIn 0.5s ease-out both;
        overflow: hidden;
    }
    .card.proximo {
        border-top-color: var(--rojo);
        box-shadow: 0 0 40px rgba(217, 0, 0, 0.6);
        transform: scale(1.02);
        z-index: 5;
    }
    
    .card-logo { height: 85px; object-fit: contain; margin-bottom: 5px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }

    .card-nombre-hora {
        display: flex; align-items: baseline; justify-content: center;
        gap: 10px; flex-wrap: wrap; margin-bottom: 5px;
    }
    .card-nombre {
        font-weight: 900; font-size: 24px; color: var(--azul-rey);
        text-transform: uppercase; text-align: center; line-height: 1;
    }
    .card-hora-inline {
        font-weight: 900; font-size: 22px; color: var(--rojo);
        background: #fee2e2; padding: 2px 12px; border-radius: 12px;
        line-height: 1.2; white-space: nowrap;
    }

    .card-fecha {
        font-size: 17px; font-weight: 900; color: #15803d; background: #dcfce7;
        padding: 4px 18px; border-radius: 20px; margin-bottom: 8px;
        letter-spacing: 0.5px;
    }
    .card-fecha.ayer { color: var(--rojo); background: #fee2e2; }
    .card-fecha.proximo-label { color: white; background: var(--rojo); animation: pulse 1.5s infinite; }

    .bolos-container { display: flex; justify-content: center; gap: 12px; margin-bottom: 8px; }
    .bolo-wrapper { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .bolo {
        width: 100px; height: 100px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-weight: 900; font-size: 48px;
        box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        border: 3px solid rgba(255,255,255,0.1);
    }
    .bolo.hoy { background: #2563eb; color: white; }
    .bolo.ayer { background: #ffffff; color: var(--azul-oscuro); border-color: #cbd5e1; }
    .bolo.esperando { background: #f59e0b; color: #78350f; }
    
    .bolo-label {
        font-size: 13px; font-weight: 900; color: var(--texto-gris);
        text-transform: uppercase; letter-spacing: 0.5px;
        background: #e2e8f0; padding: 2px 10px; border-radius: 6px;
    }

    .card-timer {
        font-size: 20px; font-weight: 900; color: var(--rojo);
        background: #fee2e2; padding: 6px 18px; border-radius: 12px;
        margin-bottom: 8px; font-variant-numeric: tabular-nums;
        border: 2px solid var(--rojo); letter-spacing: 0.5px;
        animation: pulse 1.2s infinite alternate;
    }
    .card-timer.esperando {
        background: linear-gradient(135deg, #fef3c7, #fde68a);
        color: #92400e; border-color: #f59e0b;
    }

    .card-footer {
        width: 100%; display: flex; justify-content: center; align-items: center;
        background: var(--gris-fondo); padding: 8px 15px; border-radius: 12px;
        font-size: 16px; font-weight: 900; color: var(--azul-rey);
        text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* ============================================================
       VISTA FEATURED (ÚLTIMO SORTEO) - AJUSTADA PARA QUE QUEPA
       ============================================================ */
    .split-container { display: flex; gap: 25px; height: 100%; width: 100%; }
    .split-main {
        flex: 1; background: var(--blanco);
        border: 6px solid var(--dorado); border-radius: 35px;
        display: flex; flex-direction: column; align-items: center;
        justify-content: space-evenly; /* Distribuye mejor el espacio */
        padding: 20px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    .dest-logo { height: 220px; margin-bottom: 5px; object-fit: contain; }
    .dest-nombre { font-size: 40px; font-weight: 900; color: var(--azul-rey); margin-bottom: 5px; text-transform: uppercase; }
    .dest-hora-box {
        font-size: 65px; background: linear-gradient(135deg, #fbbf24 0%, #f97316 50%, #fbbf24 100%);
        color: #ffffff; padding: 8px 60px; border-radius: 25px; font-weight: 900;
        letter-spacing: 2px; text-shadow: 0 4px 12px rgba(0,0,0,0.6);
        box-shadow: 0 15px 40px rgba(0,0,0,0.3); margin-bottom: 10px;
    }
    .dest-bolos { display: flex; justify-content: center; gap: 25px; margin-bottom: 10px; }
    .dest-bolo-wrapper { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .dest-bolo {
        width: 180px; height: 180px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 90px; font-weight: 900; color: white;
        background: #2563eb;
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        border: 4px solid #1d4ed8;
    }
    .dest-bolo-label {
        font-size: 16px; font-weight: 900; color: var(--azul-rey);
        text-transform: uppercase; letter-spacing: 1px;
        background: #dbeafe; padding: 3px 15px; border-radius: 8px;
    }
    /* Etiqueta de "Último Sorteo" achicada */
    .featured-tag {
        background:#dcfce7; color:#15803d; padding:8px 25px; border-radius:20px; font-weight:900; font-size:22px; letter-spacing:0.5px;
    }

    .side-panel { width: 580px; display: flex; flex-direction: column; gap: 12px; }
    .side-row {
        background: var(--blanco); border-radius: 20px; padding: 10px 15px;
        display: flex; justify-content: space-between; align-items: center;
        border-left: 10px solid var(--dorado);
        box-shadow: 0 5px 15px rgba(0,0,0,0.3); flex: 1;
    }
    .side-left { display: flex; align-items: center; gap: 12px; }
    .side-logo { height: 65px; object-fit: contain; }
    .side-info { display: flex; flex-direction: column; }
    .side-info .hora { color: var(--azul-oscuro); font-size: 26px; font-weight: 900; }
    .side-info .fecha { color: var(--texto-gris); font-size: 14px; font-weight: 700; text-transform: uppercase; }
    .side-bolos { display: flex; gap: 8px; }
    .side-bolo-wrapper { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .side-bolo {
        width: 65px; height: 65px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 30px; font-weight: 900;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        border: 2px solid rgba(255,255,255,0.3);
    }
    .side-bolo.hoy { background: #2563eb; color: white; }
    .side-bolo.ayer { background: #ffffff; color: var(--azul-oscuro); border-color: #cbd5e1; }
    .side-bolo-label {
        font-size: 10px; font-weight: 900; color: var(--texto-gris);
        text-transform: uppercase; letter-spacing: 0.5px;
        background: #e2e8f0; padding: 1px 6px; border-radius: 4px;
    }

    /* ADS / LIVE */
    .ad-box { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; position: relative; }
    .ad-box img, .ad-box video { width: 100%; height: 100%; object-fit: contain; }
    .ad-box iframe { width: 100%; height: 100%; border: none; }

    .live-indicator {
        position: absolute; top: 25px; left: 25px;
        background: #e63946; color: #fff; font-size: 24px; font-weight: 900;
        padding: 8px 24px; border-radius: 8px; box-shadow: 0 0 20px #e63946;
        letter-spacing: 1.5px; z-index: 50; display: inline-flex; align-items: center; gap: 8px;
    }

    /* CONEXIÓN */
    .connection-status { display: inline-flex; align-items: center; gap: 8px; margin-left: 15px; position: relative; }
    .connection-dot { width: 16px; height: 16px; border-radius: 50%; display: inline-block; transition: all 0.3s ease; flex-shrink: 0; }
    .connection-dot.online { background: #22c55e; box-shadow: 0 0 20px rgba(34, 197, 94, 0.5); }
    .connection-dot.offline { background: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }
    .connection-dot.checking { background: #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.5); }
    .connection-tooltip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: white; padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100; }
    .connection-status:hover .connection-tooltip { opacity: 1; }
    .offline-badge { display: none; background: #ef4444; color: white; font-size: 16px; font-weight: 800; padding: 2px 14px; border-radius: 20px; margin-left: 10px; }
    .offline-badge.show { display: inline-block; }

    @keyframes dropIn {
        0% { opacity: 0; transform: scale(0.8) translateY(10px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes pulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }
    @keyframes floating { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
</style>
</head>
<body>

<div id="snow-container"></div>

<div id="splash-screen">
    <img src="nuevologo.png" id="splashLogo" class="splash-logo" alt="Bancas Kiko">
    <div class="splash-text">INICIANDO PIZARRA</div>
    <div class="splash-sub">CONECTANDO A FIREBASE...</div>
</div>

<div id="preloader-cache" style="position:absolute;width:1px;height:1px;opacity:0.01;overflow:hidden;bottom:0;left:0;pointer-events:none;"></div>

<div id="canvas-master">
    <!-- TOPBAR -->
    <div class="topbar">
        <div class="brand-area">
            <img src="nuevologo.png" id="headerLogo" alt="Bancas Kiko">
            <div class="brand-text">
                <div class="brand-title">Bancas <span>Kiko</span></div>
                <div class="brand-slogan">La confianza en tu jugada</div>
            </div>
        </div>
        <div class="header-info">
            <div class="header-clock" id="liveClock">00:00:00</div>
            <div class="date-header">
                <div class="main-date" id="currentDay">...</div>
                <div class="sub-date" id="currentMonth">...</div>
                <div class="connection-status" id="connectionStatus">
                    <span class="connection-dot checking" id="connectionDot"></span>
                    <span class="connection-tooltip" id="connectionTooltip">Verificando...</span>
                </div>
                <span class="offline-badge" id="offlineBadge">📡 SIN CONEXIÓN</span>
            </div>
        </div>
    </div>

    <!-- TICKER -->
    <div class="ticker-bar">
        <div class="ticker-text" id="marqueeText">CARGANDO ANUNCIOS...</div>
    </div>

    <!-- VISTAS -->
    <div id="view-grid" class="hidden">
        <div class="grid-container" id="mainGrid"></div>
    </div>

    <div id="view-featured" class="hidden">
        <div class="split-container">
            <div class="split-main" id="featuredMain"></div>
            <div class="side-panel" id="featuredSide"></div>
        </div>
    </div>

    <!-- BRANDING -->
    <div id="view-branding">
        <img src="nuevologo.png" id="brandingLogo" class="branding-logo" alt="Bancas Kiko">
        <div class="branding-title">Bancas <span>Kiko</span></div>
        <div class="branding-slogan">LA CONFIANZA EN TU JUGADA</div>
        <div class="branding-tag">🍀 ¡LA SUERTE ESTÁ DE TU LADO! 🍀</div>
    </div>

    <div id="view-ads" class="hidden">
        <div class="ad-box" id="adDisplay"></div>
    </div>

    <div id="view-live" class="hidden">
        <div class="ad-box" id="liveDisplay"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = { databaseURL: "https://pizarra-loteria-36ba5-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let SORTEOS = [];
    let ANUNCIOS = [];
    let LOGOS = {};
    let modoNavidad = false;

    let currentView = 77;
    let gridPage = 0;
    let adIndex = 0;
    let rotationTimer = null;
    let gridTimerInterval = null;
    let enTransmisionVivo = false;
    let sistemaIniciado = false;
    let tiempoRotacionGlobal = 15000;
    let usandoCache = false;
    let isOnline = true;

    const VIEW_NAMES = ['grid', 'featured', 'branding', 'ads', 'live'];
    const _cacheImgs = [];

    /* ============================================================
       MODO NAVIDAD
       ============================================================ */
    function aplicarModoNavidad(activo) {
        modoNavidad = activo === true;
        const logoSrc = modoNavidad ? 'nuevologo2.png' : 'nuevologo.png';
        document.getElementById('splashLogo').src = logoSrc;
        document.getElementById('headerLogo').src = logoSrc;
        document.getElementById('brandingLogo').src = logoSrc;

        const snow = document.getElementById('snow-container');
        if (modoNavidad) {
            snow.style.display = 'block';
            iniciarNieve();
        } else {
            snow.style.display = 'none';
            snow.innerHTML = '';
        }
    }

    function iniciarNieve() {
        const container = document.getElementById('snow-container');
        if (!container || container.children.length > 0) return;
        const copos = ['❅', '❆', '❄', '•', '✦'];
        for (let i = 0; i < 50; i++) {
            const c = document.createElement('div');
            c.className = 'snowflake';
            c.textContent = copos[Math.floor(Math.random() * copos.length)];
            c.style.left = Math.random() * 100 + 'vw';
            c.style.fontSize = (Math.random() * 18 + 10) + 'px';
            c.style.animationDuration = (Math.random() * 4 + 4) + 's';
            c.style.animationDelay = (Math.random() * 6) + 's';
            c.style.opacity = (Math.random() * 0.5 + 0.35).toString();
            container.appendChild(c);
        }
    }

    /* ============================================================
       UTILIDADES
       ============================================================ */
    function getAhoraRD() {
        const partes = new Intl.DateTimeFormat('en-US', {
            timeZone: 'America/Santo_Domingo',
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit',
            hour12: false
        }).formatToParts(new Date());
        const get = (t) => partes.find(p => p.type === t)?.value;
        let h = parseInt(get('hour'));
        if (h === 24) h = 0;
        return {
            year: parseInt(get('year')), month: parseInt(get('month')),
            day: parseInt(get('day')), hours: h,
            minutes: parseInt(get('minute')), seconds: parseInt(get('second'))
        };
    }

    function getFormatDateRD(offset = 0) {
        const rd = getAhoraRD();
        const d = new Date(Date.UTC(rd.year, rd.month - 1, rd.day));
        d.setUTCDate(d.getUTCDate() - offset);
        return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
    }

    function convertirHoraAminutos(horaStr) {
        if (!horaStr) return 0;
        const m = horaStr.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
        if (!m) return 0;
        let h = parseInt(m[1]); const min = parseInt(m[2]);
        const ap = m[3].toUpperCase();
        if (ap === 'PM' && h !== 12) h += 12;
        if (ap === 'AM' && h === 12) h = 0;
        return h * 60 + min;
    }

    function getLogoByNombre(nombre) {
        if (!nombre) return 'anguilla.png';
        const n = nombre.toLowerCase();
        if (n.includes('loteka')) return 'lotekalogo.png';
        if (n.includes('real')) return 'logoreal.png';
        return 'anguilla.png';
    }

    function convertirLinkGitHub(url) {
        if (!url) return url;
        if (url.includes('raw.githubusercontent.com')) return url;
        if (url.includes('github.com') && url.includes('/blob/')) {
            return url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
        }
        return url;
    }

    function esVideoDirecto(url) {
        if (!url) return false;
        const u = url.toLowerCase();
        return u.includes('.mp4') || u.includes('.webm') || u.includes('.ogg') || u.includes('.mov') || u.includes('raw.githubusercontent');
    }

    /* ============================================================
       CACHÉ
       ============================================================ */
    function guardarEnCache(clave, datos) {
        try { localStorage.setItem(`kiko_${clave}`, JSON.stringify({ data: datos, t: Date.now() })); } catch {}
    }
    function obtenerDeCache(clave) {
        try { const i = localStorage.getItem(`kiko_${clave}`); return i ? JSON.parse(i) : null; } catch { return null; }
    }
    function cargarDesdeCache() {
        usandoCache = true;
        const s = obtenerDeCache('sorteos');
        if (s?.data?.length) SORTEOS = s.data;
        const a = obtenerDeCache('anuncios');
        if (a?.data?.length) ANUNCIOS = a.data.filter(x => x.activo !== false);
        const t = obtenerDeCache('ticker');
        if (t?.data) document.getElementById('marqueeText').innerText = t.data;
    }

    function actualizarIndicadorConexion(estado, msg) {
        const dot = document.getElementById('connectionDot');
        const tip = document.getElementById('connectionTooltip');
        const badge = document.getElementById('offlineBadge');
        dot.className = 'connection-dot';
        if (estado === 'online') {
            dot.classList.add('online'); tip.textContent = msg || '✅ Conectado';
            badge.classList.remove('show'); isOnline = true;
        } else if (estado === 'offline') {
            dot.classList.add('offline'); tip.textContent = msg || '❌ Sin conexión';
            badge.classList.add('show'); isOnline = false; usandoCache = true;
            cargarDesdeCache();
        } else {
            dot.classList.add('checking'); tip.textContent = msg || '⏳ Verificando...';
        }
    }

    /* ============================================================
       PROCESAMIENTO SORTEOS
       ============================================================ */
    function procesarSorteosData(dataHoy, dataAyer) {
        const out = [];
        const rd = getAhoraRD();
        const horaAct = rd.hours * 60 + rd.minutes;
        if (!dataHoy || dataHoy.length === 0) return out;

        dataHoy.forEach((sHoy, index) => {
            if (!sHoy) return;
            const m = (sHoy.hora || '').match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
            let hSor = 0, mSor = 0;
            if (m) {
                hSor = parseInt(m[1]); mSor = parseInt(m[2]);
                const ap = m[3].toUpperCase();
                if (ap === 'PM' && hSor !== 12) hSor += 12;
                if (ap === 'AM' && hSor === 12) hSor = 0;
            }
            const tieneHoy = sHoy.premios && sHoy.premios[0] !== "" && sHoy.premios[0] != null;
            const minutosRestantes = (hSor * 60 + mSor) - horaAct;
            const yaPaso = minutosRestantes <= -5;
            const faltan20 = !tieneHoy && !yaPaso && minutosRestantes <= 20 && minutosRestantes > 0;

            const s = {
                hour: (sHoy.hora || '').replace(/(AM|PM)/, ' $1').trim(),
                key: index,
                nombre: sHoy.nombre || sHoy.name || sHoy.loteria || '',
                minutosRestantes
            };
            if (tieneHoy) {
                s.day = 'hoy'; s.date = 'HOY';
                s.nums = [sHoy.premios[0], sHoy.premios[1], sHoy.premios[2]];
                s.isWaiting = false; s.isProximo = false;
            } else if (yaPaso) {
                s.day = 'hoy'; s.date = 'HOY';
                s.nums = null; s.isWaiting = true; s.isProximo = false;
            } else {
                const sAyer = Array.isArray(dataAyer) ? dataAyer.find(a => a && a.hora === sHoy.hora) : null;
                s.day = 'ayer'; s.date = 'AYER';
                s.nombre = sHoy.nombre || sAyer?.nombre || '';
                s.nums = (sAyer?.premios?.[0] !== "" && sAyer?.premios?.[0] != null)
                    ? [sAyer.premios[0], sAyer.premios[1], sAyer.premios[2]] : null;
                s.isWaiting = false; s.isProximo = faltan20;
            }
            out.push(s);
        });
        return out;
    }

    function ordenarSorteosCronologicamente(arr) {
        const hoy = arr.filter(s => s.day === 'hoy');
        const ayer = arr.filter(s => s.day === 'ayer');
        const ord = (a) => a.sort((x, y) => convertirHoraAminutos(x.hour) - convertirHoraAminutos(y.hour));
        return [...ord(hoy), ...ord(ayer)];
    }

    /* ============================================================
       INICIALIZACIÓN FIREBASE
       ============================================================ */
    function inicializarDatos() {
        database.ref('web_kiko/modo_navidad').on('value', snap => {
            aplicarModoNavidad(snap.val() === true);
        });

        database.ref('ticker').on('value', snap => {
            const txt = snap.val() || 'BIENVENIDOS A BANCAS KIKO';
            document.getElementById('marqueeText').innerText = txt;
            guardarEnCache('ticker', txt);
        });

        database.ref('configuracion/tiempoPantalla').on('value', snap => {
            if (snap.val()) tiempoRotacionGlobal = parseInt(snap.val()) * 1000;
        });

        database.ref('anunciosList').on('value', snap => {
            ANUNCIOS = [];
            const preloader = document.getElementById('preloader-cache');
            if (preloader) preloader.innerHTML = '';
            if (snap.exists()) snap.forEach(child => {
                const v = child.val();
                if (v?.activo !== false && v?.url?.trim()) {
                    ANUNCIOS.push(v);
                    const img = new Image();
                    img.decoding = 'async';
                    img.src = convertirLinkGitHub(v.url.trim());
                    _cacheImgs.push(img);
                    if (preloader) preloader.appendChild(img);
                }
            });
            guardarEnCache('anuncios', ANUNCIOS);
            if (adIndex >= ANUNCIOS.length) adIndex = 0;
        });

        database.ref('web_kiko/logos').on('value', snap => {
            LOGOS = snap.val() || {};
        });

        const hoyStr = getFormatDateRD(0);
        const ayerStr = getFormatDateRD(1);
        database.ref(`sorteos/${hoyStr}`).on('value', snapHoy => {
            const dataHoy = snapHoy.val() || [];
            database.ref(`sorteos/${ayerStr}`).once('value', snapAyer => {
                const dataAyer = snapAyer.val() || [];
                const proc = procesarSorteosData(dataHoy, dataAyer);
                if (proc.length > 0) {
                    SORTEOS = ordenarSorteosCronologicamente(proc);
                    guardarEnCache('sorteos', SORTEOS);
                }
                if (sistemaIniciado && !enTransmisionVivo) {
                    if (currentView === 0) renderGrid();
                    if (currentView === 88) renderFeatured();
                }
            });
        });

        database.ref('transmisionVivo').on('value', snap => {
            if (!sistemaIniciado) return;
            const live = snap.val();
            if (live && live.activo === true) {
                enTransmisionVivo = true;
                cancelarRotacion();
                clearInterval(gridTimerInterval);
                mostrarVista('live');
                const box = document.getElementById('liveDisplay');
                const raw = live.url || '';
                if (esVideoDirecto(raw)) {
                    box.innerHTML = `<div class="live-indicator">● EN VIVO</div><video src="${convertirLinkGitHub(raw)}" autoplay muted playsinline controls style="width:100%;height:100%;background:#000;"></video>`;
                } else {
                    let embed = raw.replace('watch?v=', 'embed/').replace('youtu.be/', 'youtube.com/embed/');
                    if (embed.includes('?')) embed = embed.split('?')[0];
                    box.innerHTML = `<div class="live-indicator">● EN VIVO</div><iframe src="${embed}?autoplay=1&mute=1&controls=0&rel=0" allow="autoplay; encrypted-media" style="width:100%;height:100%;border:none;"></iframe>`;
                }
            } else if (enTransmisionVivo) {
                enTransmisionVivo = false;
                document.getElementById('liveDisplay').innerHTML = '';
                currentView = 0; gridPage = 0;
                mostrarVista('grid'); renderGrid();
                programarRotacion(tiempoRotacionGlobal);
            }
        });
    }

    /* ============================================================
       VISTAS
       ============================================================ */
    function mostrarVista(nombre) {
        VIEW_NAMES.forEach(v => {
            const el = document.getElementById('view-' + v);
            if (el) el.classList.add('hidden');
        });
        const t = document.getElementById('view-' + nombre);
        if (t) t.classList.remove('hidden');
    }

    /* ============================================================
       ROTACIÓN
       ============================================================ */
    function programarRotacion(ms) {
        cancelarRotacion();
        rotationTimer = setTimeout(rotateDisplay, Math.max(1000, ms));
    }
    function cancelarRotacion() {
        if (rotationTimer) { clearTimeout(rotationTimer); rotationTimer = null; }
    }

    function rotateDisplay() {
        if (enTransmisionVivo || !sistemaIniciado) return;
        let nextTime = tiempoRotacionGlobal;
        const totalPages = Math.max(1, Math.ceil(SORTEOS.length / 8));

        if (currentView === 0) {
            if (gridPage < totalPages - 1) {
                gridPage++;
                mostrarVista('grid'); renderGrid();
            } else {
                currentView = 88; gridPage = 0;
                mostrarVista('featured'); renderFeatured();
            }
        } else if (currentView === 88) {
            currentView = 77;
            mostrarVista('branding');
        } else if (currentView === 77) {
            currentView = 99; adIndex = 0;
            mostrarVista('ads');
            nextTime = renderMediaAd();
        } else if (currentView === 99) {
            currentView = 0; gridPage = 0;
            mostrarVista('grid'); renderGrid();
        } else {
            currentView = 0; gridPage = 0;
            mostrarVista('grid'); renderGrid();
        }
        programarRotacion(nextTime);
    }

    /* ============================================================
       RENDER GRID
       ============================================================ */
    function renderGrid() {
        clearInterval(gridTimerInterval);
        const grid = document.getElementById('mainGrid');
        if (!grid) return;
        grid.innerHTML = '';
        if (SORTEOS.length === 0) {
            grid.innerHTML = `<div style="grid-column:1/-1; color:white; font-size:32px; font-weight:800; text-align:center; padding:50px;">
                ${usandoCache ? '📡 MODO OFFLINE — CARGANDO...' : 'ESPERANDO DATOS...'}</div>`;
            return;
        }
        const start = gridPage * 8;
        const items = SORTEOS.slice(start, start + 8);

        items.forEach((s, idx) => {
            const card = document.createElement('div');
            card.className = `card ${s.isProximo || s.isWaiting ? 'proximo' : ''}`;
            card.style.animationDelay = `${idx * 0.05}s`;

            let claseFecha = s.day === 'hoy' ? '' : 'ayer';
            let txtFecha = s.day === 'hoy' ? 'HOY' : 'AYER';
            let boloClass = s.day === 'hoy' ? 'hoy' : 'ayer';
            let timerHtml = '';

            if (s.isWaiting) {
                claseFecha = 'proximo-label'; txtFecha = 'ESPERANDO';
                boloClass = 'esperando';
                timerHtml = `<div class="card-timer esperando">⏳ ESPERANDO RESULTADOS...</div>`;
            } else if (s.isProximo) {
                claseFecha = 'proximo-label'; txtFecha = '¡POR SALIR!';
                boloClass = 'ayer';
                timerHtml = `<div class="card-timer" id="gridTimer">⏱ ...</div>`;
            }

            const nums = s.isWaiting ? ['?','?','?'] : (s.nums || ['--','--','--']);

            card.innerHTML = `
                <div style="text-align:center; width:100%;">
                    <img class="card-logo" src="${getLogoByNombre(s.nombre)}" onerror="this.src='anguilla.png'">
                    <div class="card-nombre-hora">
                        <span class="card-nombre">${s.nombre || 'Anguilla'}</span>
                        <span class="card-hora-inline">${s.hour}</span>
                    </div>
                    <div class="card-fecha ${claseFecha}">${txtFecha}</div>
                </div>
                ${timerHtml}
                <div class="bolos-container">
                    <div class="bolo-wrapper">
                        <div class="bolo ${boloClass}">${nums[0]}</div>
                        <div class="bolo-label">1ro</div>
                    </div>
                    <div class="bolo-wrapper">
                        <div class="bolo ${boloClass}">${nums[1]}</div>
                        <div class="bolo-label">2do</div>
                    </div>
                    <div class="bolo-wrapper">
                        <div class="bolo ${boloClass}">${nums[2]}</div>
                        <div class="bolo-label">3ro</div>
                    </div>
                </div>
                <div class="card-footer">${s.nombre || 'Anguilla'}</div>
            `;
            grid.appendChild(card);
        });

        const prox = items.find(s => s.isProximo);
        if (prox) iniciarGridTimer(prox.hour);
    }

    function iniciarGridTimer(hora) {
        clearInterval(gridTimerInterval);
        const el = document.getElementById('gridTimer');
        if (!el) return;
        const m = hora.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
        if (!m) return;
        let hS = parseInt(m[1]); const mS = parseInt(m[2]);
        const ap = m[3].toUpperCase();
        if (ap === 'PM' && hS !== 12) hS += 12;
        if (ap === 'AM' && hS === 12) hS = 0;

        gridTimerInterval = setInterval(() => {
            const rd = getAhoraRD();
            const ahora = rd.hours * 3600 + rd.minutes * 60 + rd.seconds;
            const sorteo = hS * 3600 + mS * 60;
            const diff = sorteo - ahora;
            if (diff <= 0) {
                el.innerHTML = `⏳ ESPERANDO...`;
                el.className = 'card-timer esperando';
                return;
            }
            const mm = Math.floor(diff / 60);
            const ss = diff % 60;
            el.innerHTML = `⏱ Faltan ${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
        }, 1000);
    }

    /* ============================================================
       RENDER FEATURED (ÚLTIMO SORTEO) - Ajustado
       ============================================================ */
    function generarPanelLateral(id) {
        const jugados = SORTEOS.filter(s => s.nums?.length > 0);
        const panel = document.getElementById(id);
        if (!panel) return SORTEOS[0] || { hour: '--:--', date: 'HOY', nums: null, nombre: '' };
        if (jugados.length === 0) {
            panel.innerHTML = '<div style="color:var(--rojo); font-size:22px; font-weight:900; text-align:center; padding:20px;">NO HAY SORTEOS PREVIOS</div>';
            return SORTEOS[0] || { hour: '--:--', date: 'HOY', nums: null, nombre: '' };
        }
        jugados.sort((a, b) => {
            if (a.day === b.day) return convertirHoraAminutos(b.hour) - convertirHoraAminutos(a.hour);
            return a.day === 'hoy' ? -1 : 1;
        });
        const last = jugados[0];
        const hist = jugados.slice(1, 6);
        panel.innerHTML = hist.map((s, idx) => {
            const boloClass = s.day === 'hoy' ? 'hoy' : 'ayer';
            return `<div class="side-row">
                <div class="side-left">
                    <img class="side-logo" src="${getLogoByNombre(s.nombre)}" onerror="this.src='anguilla.png'">
                    <div class="side-info">
                        <span class="hora">${s.hour}</span>
                        <span class="fecha">${s.nombre ? s.nombre + ' · ' : ''}${s.date}</span>
                    </div>
                </div>
                <div class="side-bolos">
                    <div class="side-bolo-wrapper">
                        <div class="side-bolo ${boloClass}" style="animation-delay:${idx*0.05}s">${s.nums[0]}</div>
                        <div class="side-bolo-label">1ro</div>
                    </div>
                    <div class="side-bolo-wrapper">
                        <div class="side-bolo ${boloClass}" style="animation-delay:${idx*0.05+0.08}s">${s.nums[1]}</div>
                        <div class="side-bolo-label">2do</div>
                    </div>
                    <div class="side-bolo-wrapper">
                        <div class="side-bolo ${boloClass}" style="animation-delay:${idx*0.05+0.16}s">${s.nums[2]}</div>
                        <div class="side-bolo-label">3ro</div>
                    </div>
                </div>
            </div>`;
        }).join('');
        return last;
    }

    function renderFeatured() {
        const last = generarPanelLateral('featuredSide');
        const main = document.getElementById('featuredMain');
        if (!main) return;
        const esHoy = last.day === 'hoy';
        main.innerHTML = `
            <img class="dest-logo" src="${getLogoByNombre(last.nombre)}" onerror="this.src='anguilla.png'">
            <div class="dest-nombre">${last.nombre || 'Anguilla'}</div>
            <div class="dest-hora-box">${last.hour || '--:--'}</div>
            <div class="dest-bolos">
                <div class="dest-bolo-wrapper">
                    <div class="dest-bolo">${last.nums ? last.nums[0] : '?'}</div>
                    <div class="dest-bolo-label">1ro</div>
                </div>
                <div class="dest-bolo-wrapper">
                    <div class="dest-bolo">${last.nums ? last.nums[1] : '?'}</div>
                    <div class="dest-bolo-label">2do</div>
                </div>
                <div class="dest-bolo-wrapper">
                    <div class="dest-bolo">${last.nums ? last.nums[2] : '?'}</div>
                    <div class="dest-bolo-label">3ro</div>
                </div>
            </div>
            <div class="featured-tag">
                ÚLTIMO SORTEO · ${esHoy ? 'HOY' : 'AYER'}
            </div>`;
    }

    /* ============================================================
       RENDER ANUNCIOS
       ============================================================ */
    function renderMediaAd() {
        const box = document.getElementById('adDisplay');
        if (!box) return tiempoRotacionGlobal;
        box.innerHTML = '';
        const activos = ANUNCIOS.filter(ad => ad && ad.activo !== false && ad.url && ad.url.trim());
        if (activos.length === 0) {
            box.innerHTML = `<div style="color:white; font-size:60px; font-weight:800; text-align:center;">
                BANCAS KIKO<br><span style="font-size:28px; color:#ffcc00; letter-spacing:4px;">LA CONFIANZA EN TU JUGADA</span></div>`;
            return 6000;
        }
        if (adIndex >= activos.length) adIndex = 0;
        const ad = activos[adIndex];
        const url = ad.url.trim();
        const urlP = convertirLinkGitHub(url);

        if (esVideoDirecto(url)) {
            box.innerHTML = `<video src="${urlP}" autoplay muted playsinline preload="auto" style="width:100%;height:100%;object-fit:contain;background:#000;"></video>`;
        } else if (url.includes('youtube.com') || url.includes('youtu.be')) {
            let embed = url.replace('watch?v=', 'embed/').replace('youtu.be/', 'youtube.com/embed/');
            if (embed.includes('?')) embed = embed.split('?')[0];
            box.innerHTML = `<iframe src="${embed}?autoplay=1&mute=1&controls=0&rel=0" allow="autoplay; encrypted-media" style="width:100%;height:100%;border:none;" loading="lazy"></iframe>`;
        } else {
            box.innerHTML = `<img src="${urlP}" loading="eager" style="width:100%;height:100%;object-fit:contain;background:#000;" alt="Anuncio">`;
            const img = box.querySelector('img');
            if (img) img.onerror = () => {
                box.innerHTML = `<div style="color:white; font-size:60px; font-weight:800;">BANCAS KIKO</div>`;
            };
        }
        const t = (parseInt(ad.tiempo) || 15) * 1000;
        adIndex++;
        return t;
    }

    /* ============================================================
       RELOJ
       ============================================================ */
    function updateDateTime() {
        const rd = getAhoraRD();
        const hrs = rd.hours % 12 || 12;
        document.getElementById('liveClock').innerText =
            `${hrs}:${String(rd.minutes).padStart(2,'0')}:${String(rd.seconds).padStart(2,'0')} ${rd.hours >= 12 ? 'PM' : 'AM'}`;
        const dias = ['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
        const meses = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
        const f = new Date(Date.UTC(rd.year, rd.month - 1, rd.day));
        document.getElementById('currentDay').innerText = `${dias[f.getUTCDay()]} ${rd.day}`;
        document.getElementById('currentMonth').innerText = `${meses[rd.month - 1]} ${rd.year}`;
    }

    /* ============================================================
       WAKELOCK
       ============================================================ */
    let wakeLock = null;
    async function activarWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                document.addEventListener('visibilitychange', async () => {
                    if (wakeLock !== null && document.visibilityState === 'visible') {
                        try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
                    }
                });
            }
        } catch {}
    }

    /* ============================================================
       ESCALADO
       ============================================================ */
    function dimensionarPantalla() {
        const w = window.innerWidth, h = window.innerHeight;
        let scale = Math.min(w / 1920, h / 1080);
        if (scale > 1.6) scale = 1.6;
        document.getElementById('canvas-master').style.transform =
            `translate(-50%, -50%) scale(${scale})`;
    }

    /* ============================================================
       INICIO
       ============================================================ */
    window.onload = () => {
        ['nuevologo.png', 'nuevologo2.png', 'anguilla.png', 'logoreal.png', 'lotekalogo.png'].forEach(src => {
            const i = new Image(); i.decoding = 'async'; i.src = src; _cacheImgs.push(i);
        });
        dimensionarPantalla();
        window.addEventListener('resize', dimensionarPantalla);
        updateDateTime();
        setInterval(updateDateTime, 1000);
        database.ref('.info/connected').on('value', snap => {
            if (snap.val()) actualizarIndicadorConexion('online', '✅ Conectado');
            else actualizarIndicadorConexion('offline', '❌ Sin conexión');
        });
        cargarDesdeCache();
        inicializarDatos();
        activarWakeLock();

        setTimeout(() => {
            const s = document.getElementById('splash-screen');
            s.style.opacity = '0'; s.style.visibility = 'hidden';
            sistemaIniciado = true;
            currentView = 77;
            mostrarVista('branding');

            setTimeout(() => {
                currentView = 0; gridPage = 0;
                mostrarVista('grid'); renderGrid();
                programarRotacion(tiempoRotacionGlobal);
            }, 5000);
        }, 1500);
    };
</script>
</body>
</html>
